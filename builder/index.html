ition:fixed;left:50%;transform:translateX(-50%) translateY(-140%);top:12px;z-index:50;background:var(--calm);color:#26200F;padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;transition:transform .3s}#toast.on{transform:translateX(-50%) translateY(0)}#run{display:none}#run.on{display:block}.runtop{display:flex;align-items:center;gap:12px;padding:14px 18px 8px;max-width:680px;margin:0 auto}.runtop .of{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.08em}.runtop .sp{flex:1}.iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 11px;font-size:12.5px;font-family:var(--sans);cursor:pointer}.stage{display:flex;gap:14px;max-width:680px;margin:0 auto;padding:0 18px 26px}.spine{width:11px;flex:0 0 11px;display:flex;flex-direction:column;gap:3px;padding-top:4px}.spine i{flex:1;background:#233A30;border-radius:6px;min-height:4px;display:block}.spine i.done{background:#3C6350}.spine i.now{background:var(--signal)}.main{flex:1;min-width:0}#title{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.12;margin:0 0 3px}#reps{font-family:var(--mono);font-size:12px;color:var(--calm);letter-spacing:.06em;margin:0 0 12px;min-height:15px}#art{display:flex;gap:8px;margin:0 0 14px;cursor:zoom-in}#art:empty{display:none}#art figure{flex:1;min-width:0;margin:0}#art figcaption{font-size:10.5px;color:var(--dim);margin-top:4px}svg.fg{display:block;width:100%;height:auto;background:#16261F;border-radius:9px}svg.fg .gr{stroke:#3E5A4B;stroke-width:2;stroke-linecap:round}svg.fg polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}svg.fg .ts{stroke:#ECEFE7;stroke-width:11}svg.fg .lb{stroke:#ECEFE7;stroke-width:5}svg.fg .fr{stroke:#7B9A77;stroke-width:4.2}svg.fg .gh{stroke:#5E7669;stroke-width:3.4;stroke-dasharray:5 5;opacity:.62}svg.fg .bd{stroke:#DDBE7E;stroke-width:3}svg.fg .hd{fill:#ECEFE7}svg.fg .rg{fill:none;stroke:#DDBE7E;stroke-width:3}svg.fg .ar{fill:none;stroke:#DDBE7E; d apart, elbows hugging in"],"c":"Never lose the tension in the band","f":null,"g":"Band","e":["Loop band"]},{"s":"27 Aug","n":"Band pulses overhead","r":"","d":75,"st":["Cross the legs, hold the band","Pinky-finger sides closer together — external rotation","Arms up, elevate the shoulder blades","Pulse back, shoulder blades toward each other"],"c":"Don't go all the way back. Balance the two arms","f":null,"g":"Band","e":["Loop band"]},{"s":"27 Aug","n":"Banded cat–cow","r":"","d":135,"st":["Loop under both feet","Hands forward, external rotation, elevate, take it overhead","Keep pulling the band apart","Inhale to open — cow: chest forward, arms back, gaze up","Exhale to round — cat: arms still pushing up"],"c":"Too much in the traps? Come down. Work the spine","f":null,"g":"Band","e":["Loop band"]},{"s":"4 Sep","n":"Shoulder flossing, both arms","r":"","d":60,"st":["Hold the band with the pinkies turned towards one another, and a light resistance already in it.","Inhale, reach the arms up, then take them behind you.","Keep the ribs closed so the back stays straight — the motion comes only from the shoulders, not from a backbend.","Elevate the shoulders and keep pushing the elbows into a straight position."],"c":"The shoulder shouldn't come forward to bring the band back","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='86' cy='40' r='8' class='hd'/><polyline points='86,52 102,38 112,22' class='fr'/><polyline points='86,52 70,38 60,22' class='lb'/><polyline points='60,22 86,17 112,22' class='bd'/><path d='M52 40 Q44 32 52 24' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86, and","e":["Loop band"]},{"s":"4 Sep","n":"One arm up, eyes the other way","r":"10 each side","d":90,"st":["Sit tall with the ribs tucked in so you're not arching — the movement is only in the arm.","The left arm goes up and back behind you in external rotation, elbow straightening as it travels.","Since it's the left arm working, turn your eyes sharp right and hold them there, and see if it improves the range.","Ten reps, then switch at the chime: right arm up, eyes sharp left."],"c":"Close the ribs and isolate the movement to the arm","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='86' cy='39' r='8' class='hd'/><polyline points='86,52 102,60 108,70' class='fr'/><polyline points='86,52 74,38 78,22' class='lb'/><polyline points='78,22 94,54 108,70' class='bd'/><path d='M58 22 Q48 13 50 12' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='88' cy='39' r='8' class='hd'/><polyline points='86,52 102,60 108,70' class='fr'/><polyline points='86,52 78,36 92,18' class='lb'/><polyline points='92,18 100,48 108,70' class='bd'/><polyline points='86,52 74,38 78,22' class='gh'/><path d='M74 14 Q85 3 92 12' class='ar'/></svg>"],"ca":"Ribs closed, setting up","cb":"Arm reaching back","m":"Switch — right arm up, eyes left","g":"Band","e":["Loop band"]},{"s":"4 Sep","n":"Cow face arms with the band","r":"5 each side","d":90,"st":["Gomukhasana arms: one arm internally rotates and goes behind you, the other externally rotates and comes up and over.","The right hand holds the band low behind and pulls down for resistance; the left elbow comes in close towards your face.","Only the top arm works — bend it and straighten it five times, and let the triceps do the job.","Then push both arms backwards together. At the chime, right arm on top."],"c":"Don't let the top elbow splay out — hug it in towards your ear","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='92,84 104,104 86,106' class='fr'/><polyline points='92,84 78,104 98,106' class='lb'/><polyline points='92,84 92,65 92,46' class='ts'/><circle cx='92' cy='33' r='8' class='hd'/><polyline points='92,46 104,58 104,72' class='fr'/><polyline points='92,46 78,36 88,26' class='lb'/><polyline points='88,26 98,48 104,72' class='bd'/><path d='M60 34 Q51 40 60 46' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='92,84 104,104 86,106' class='fr'/><polyline points='92,84 78,104 98,106' class='lb'/><polyline points='92,84 92,65 92,46' class='ts'/><circle cx='92' cy='33' r='8' class='hd'/><polyline points='92,46 104,58 104,72' class='fr'/><polyline points='92,46 78,36 88,12' class='lb'/><polyline points='88,12 98,48 104,72' class='bd'/><polyline points='92,46 78,36 88,26' class='gh'/><path d='M60 26 Q53 16 62 10' class='ar'/></svg>"],"ca":"Top elbow bent","cb":"Straightening, pushing back","m":"Switch — right arm on top","g":"Band","e":["Loop band"]},{"s":"4 Sep","n":"Shoulder flossing again","r":"","d":45,"st":["Shake out the shoulders and pick the band back up.","Same as the very first time: pinkies turned in, ribs closed, arms up and then behind you.","Add the extension as well, and notice what's changed."],"c":"Do you feel more range of motion?","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='86' cy='40' r='8' class='hd'/><polyline points='86,52 102,38 112,22' class='fr'/><polyline points='86,52 70,38 60,22' class='lb'/><polyline points='60,22 86,17 112,22' class='bd'/><path d='M52 40 Q44 32 52 24' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 85,74 84,52' class='ts'/><circle cx='80' cy='40' r='8' class='hd'/><polyline points='84,52 100,38 122,22' class='fr'/><polyline points='84,52 68,38 70,22' class='lb'/><polyline points='70,22 96,17 122,22' class='bd'/><polyline points='84,52 66,40 58,22' class='gh'/><path d='M52 22 Q61 10 66 14' class='ar'/></svg>"],"ca":"Arms up in front","cb":"Travelling behind","m":null,"g":"Band","e":["Loop band"]},{"s":"4 Sep","n":"Low lunge, right arm circles","r":"hold 5","d":110,"st":["From down dog take the right leg up and back, bend the knee and turn the hips open, then step the right foot outside the right hand. Left knee down.","Make a small loop in the strap and hook it around the left foot, holding it with the right hand in external rotation, palm facing up.","Shift the hips back into a half split, right hand reaching towards the right toe, front leg straight.","Then bend the front knee and take the arm behind you — the arm makes a half circle, behind you and around.","On the last round stay there, bend the knee, walk the hand down the strap and push the leg back. Head back, hold for five."],"c":"Leave enough room to use your leg to push the arm","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='96,72 120,86 132,104' class='fr'/><polyline points='96,72 72,88 62,104' class='lb'/><polyline points='96,72 90,62 84,52' class='ts'/><polyline points='84,52 78,66 70,78' class='fr'/><polyline points='84,52 70,60 56,74' class='lb'/><circle cx='74' cy='42' r='8' class='hd'/><polyline points='56,74 84,92 132,100' class='bd'/><polyline points='84,52 98,40 104,30' class='gh'/><path d='M46 62 Q43 61 40 76' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='96,72 120,86 132,104' class='fr'/><polyline points='96,72 72,88 62,104' class='lb'/><polyline points='96,72 90,62 90,46' class='ts'/><polyline points='90,46 78,66 70,78' class='fr'/><polyline points='90,46 98,40 104,30' class='lb'/><circle cx='80' cy='36' r='8' class='hd'/><polyline points='104,30 84,92 132,100' class='bd'/><polyline points='90,46 70,60 56,74' class='gh'/><path d='M112 22 Q127 29 122 36' class='ar'/></svg>"],"ca":"Half split, reaching forward","cb":"Arm circling behind","m":null,"g":"Strap","e":["Strap"]},{"s":"4 Sep","n":"Low lunge, left arm circles","r":"hold 5","d":110,"st":["Down dog with the left leg lifted. Turn the hips, point the left toes back and let the right leg extend. One more breath there.","Pull the left knee into the chest, round the back and step the left foot outside the left hand.","Hook the strap to the back foot and keep the left arm in external rotation; the right hand can come out to the side.","Reach, shift the hips back towards the left foot, then bend the knee and take the arm behind — three circles, letting the head travel back.","Last round: stay up, take the strap over your shoulder like a backpack so the elbow faces in and up, and push the leg back. Hold for five."],"c":"The angle of the arm changes as it circles","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='104,72 80,86 68,104' class='fr'/><polyline points='104,72 128,88 138,104' class='lb'/><polyline points='104,72 110,62 116,52' class='ts'/><polyline points='116,52 122,66 130,78' class='fr'/><polyline points='116,52 130,60 144,74' class='lb'/><circle cx='126' cy='42' r='8' class='hd'/><polyline points='144,74 116,92 68,100' class='bd'/><polyline points='116,52 102,40 96,30' clas w in and close the side ribs","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='86' cy='39' r='8' class='hd'/><polyline points='86,52 104,62 108,74' class='fr'/><polyline points='86,52 76,44 84,32' class='lb'/><path d='M66 34 Q64 45 78 44' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 90,74 96,52' class='ts'/><circle cx='102' cy='41' r='8' class='hd'/><polyline points='96,52 112,66 116,78' class='fr'/><polyline points='96,52 82,38 66,28' class='lb'/><polyline points='96,52 88,42 94,28' class='gh'/><path d='M60 24 Q42 23 44 34' class='ar'/></svg>"],"ca":"Elbow in, shoulder blade down","cb":"Reaching up and over","m":"Switch sides — left arm up","g":"Side","e":[]},{"s":"4 Sep","n":"Breathe into the top ribs","r":"","d":45,"st":["Stay in the twist and rest the top hand on the one underneath.","Breathe towards the top ribcage and expand that area.","Keep inhaling, keep inhaling, hold it at the top, and release.","Then try the arm one more time and see how much further it travels."],"c":"Breathe and expand into the top side — more, more, more","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='112,96 132,88 140,100' class='fr'/><polyline points='112,96 130,94 138,104' class='lb'/><polyline points='112,96 94,98 74,96' class='ts'/><circle cx='62' cy='94' r='8' class='hd'/><polyline points='80,96 62,92 48,96' class='lb'/><polyline points='80,98 62,96 48,100' class='fr'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='112,94 132,86 140,98' class='fr'/><polyline points='112,94 130,92 138,102' class='lb'/><polyline points='112,94 94,90 74,92' class='ts'/><circle cx='62' cy='90' r='8' class='hd'/><polyline points='80,92 62,88 48,92' class='lb'/><polyline points='80,94 62,92 48,96' class='fr'/><polyline points='112,96 94,98 74,96' class='gh'/><path d='M96 76 Q108 69 96 62' class='ar'/></svg>"],"ca":"Hand resting on hand","cb":"Expanding the top side","m":null,"g":"Side","e":[]},{"s":"21 Aug","n":"Divergence Eye Drill","r":"10×","d":60,"st":["Hold a pen at your nose. With the eyes open, move it out to about a foot away.","Close the eyes, bring it back to the nose, and repeat.","Track it on the way out only — return with the eyes closed."],"c":"","f":null,"g":"Eyes","e":["Pen"]},{"s":"4 Sep","n":"Steady thumb, head side to side","r":"20 seconds","d":25,"st":["Thumb up in front of you, or find a steady point on the wall.","Keep the gaze on it — the eyes don't move, only the head.","Turn the head side to side, and keep the target clear rather than blurred."],"c":"Keep your focus on the thumb — only the head moves","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='79' cy='39' r='8' class='hd'/><polyline points='86,52 100,58 104,68' class='fr'/><polyline points='86,52 78,44 80,28' class='lb'/><circle cx='80' cy='24' r='4' class='rg'/><path d='M72 30 Q65 20 58 30' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='93' cy='39' r='8' class='hd'/><polyline points='86,52 100,58 104,68' class='fr'/><polyline points='86,52 78,44 80,28' class='lb'/><circle cx='80' cy='24' r='4' class='rg'/><path d='M  124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='86' cy='40' r='8' class='hd'/><polyline points='86,52 74,62 70,72' class='fr'/><polyline points='86,52 106,50 98,36' class='lb'/><polyline points='86,52 108,50 126,48' class='gh'/><path d='M126 36 Q120 27 114 36' class='ar'/></svg>"],"ca":"Arm pushing away, head tilted","cb":"Elbow in, head to centre","m":null,"g":"Nerve","e":[]},{"s":"4 Sep","n":"Nerve floss, left arm","r":"×5","d":45,"st":["The left arm pushes out to the side, shoulder pressing down away from the ear.","The head tilts to the right, away from the working arm.","Feel the tingling in the arm, then come back — elbow in, head to centre.","Push out and back in, five reps."],"c":"Shoulder stays down as the arm pushes out","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='92' cy='40' r='8' class='hd'/><polyline points='86,52 98,62 102,72' class='fr'/><polyline points='86,52 64,50 46,48' class='lb'/><polyline points='86,52 72,54 76,38' class='gh'/><path d='M40 34 Q34 25 28 34' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='86' cy='40' r='8' class='hd'/><polyline points='86,52 98,62 102,72' class='fr'/><polyline points='86,52 66,50 74,36' class='lb'/><polyline points='86,52 64,50 46,48' class='gh'/><path d='M46 36 Q52 27 58 36' class='ar'/></svg>"],"ca":"Arm pushing out, head tilted","cb":"Coming back in","m":null,"g":"Nerve","e":[]},{"s":"21 Aug","n":"Scapular Push-Ups","r":"15×","d":60,"st":["In a modified push-up position, let the shoulder blades pinch together, then spread apart."],"c":"","f":null,"g":"Strength","e":[]},{"s":"21 Aug","n":"Prone Head Press","r":"10× + 10 pulses","d":60,"st":["On your stomach, hands behind the head.","Press the head down into the hands while pulling the shoulders up."],"c":"","f":null,"g":"Strength","e":[]},{"s":"27 Aug","n":"Cobra lifts","r":"×10","d":75,"st":["Face down, toes tucked under the couch","Hands behind the head, elbows out to the sides","Lift, squeeze the belly in, glutes active","Head back, push into your hands"],"c":"Ears in line with the shoulders","f":null,"g":"Strength","e":["Couch"]},{"s":"4 Sep","n":"Wide-hand cobra","r":"×5","d":60,"st":["Come into plank and lower all the way to the floor — no chaturangas.","Hands wide, maybe outside the mat, elbows bent, feet as wide as the mat and the toes pointed back.","Lengthen the side body: shoulders move up towards the ears and the belly pulls in.","Shoulders back, shoulder blades together, head back — then lower down slowly. Five lifts."],"c":"Pull the belly up as you lift","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='112,100 132,102 146,104' class='fr'/><polyline points='112,100 92,100 72,100' class='ts'/><polyline points='84,100 78,104 74,104' class='lb'/><circle cx='62' cy='100' r='8' class='hd'/><path d='M62 84 Q52 77 62 70' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='114,100 134,102 148,104' class='fr'/><polyline points='114,100 94,92 76,74' class='ts'/><polyline points='94,92 86,102 74,104' class='lb'/><polyline points='94,92 90,102 78,104' class='fr'/><circle cx='68' cy='66' r='8' class='hd'/><polyline points='114,100 92,100 72,100' class='gh'/><path d='M58 74 Q46 67 54 60' class='ar'/></svg>"],"ca":"Lowered down","cb":"Lifted, head back","m":null,"g":"Strength","e":[]},{"s":"4 Sep","n":"Elbows in, hands lifted","r":"","d":50,"st":["Bring the hands closer this time, forearms perpendicular to the ground, and lift the head.","Now lift the hands off the floor and keep squeezing the elbows in, as if a foam roller sat between them.","The hands aren't touching. Push the back of the head backwards.","Squeeze the glutes and engage the core so the lower back doesn't collapse."],"c":"Use your back muscles instead of your arms","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='116,100 136,102 150,104' class='fr'/><polyline points='116,100 96,92 78,74' class='ts'/><polyline points='96,92 86,86 82,76' class='lb'/><circle cx='70' cy='66' r='8' class='hd'/><path d='M96 74 Q94 62 88 66' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='114,100 134,102 148,104' class='fr'/><polyline points='114,100 94,98 76,94' class='ts'/><polyline points='94,98 86,94 82,88' class='lb'/><circle cx='68' cy='90' r='8' class='hd'/><polyline points='114,100 94,92 76,74' class='gh'/><path d='M60 80 Q50 86 60 92' class='ar'/></svg>"],"ca":"Lifted, elbows squeezing","cb":"Lowering down","m":null,"g":"Strength","e":[]},{"s":"4 Sep","n":"Foam roller between the elbows","r":"hold 5","d":60,"st":["Lie on your belly and take the foam roller behind you, then bring one hand closer and then the other.","Your hands don't touch the floor — you should feel the roller in between your elbows.","Squeeze it and lift: glutes on, pubic bone pressing down, everything lifting through the back muscles.","Chin parallel to the chest so the back of the neck stays long. Hold it there for five."],"c":"Elbows hug in","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='116,100 136,102 150,104' class='fr'/><polyline points='116,100 96,100 78,98' class='ts'/><polyline points='96,100 88,94 84,88' class='lb'/><circle cx='86' cy='86' r='7' class='rg'/><circle cx='68' cy='94' r='8' class='hd'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='116,100 136,102 150,104' class='fr'/><polyline points='116,100 96,90 78,70' class='ts'/><polyline points='96,90 88,82 84,74' class='lb'/><circle cx='86' cy='72' r='7' class='rg'/><circle cx='70' cy='62' r='8' class='hd'/><polyline points='116,100 96,100 78,98' class='gh'/><path d='M58 72 Q46 65 54 58' class='ar'/></svg>"],"ca":"Roller in place","cb":"Squeeze and lift","m":null,"g":"Strength","e":["Foam roller"]},{"s":"4 Sep","n":"Sliding blanket, child's pose to cobra","r":"","d":110,"st":["Blanket in front of the mat with your hands on the sliding surface. Start in child's pose.","Round the back into cat with the tailbone tucked, then find your cobra — toes down or pointed, whichever you prefer.","Lower down very slowly and slide the blanket forward, keeping the elbows straight.","Pull everything in as far as you can. When you can't pull any further, that's the moment to bend the elbows and push up into cobra.","Then round the back and travel back to child's pose."],"c":"Hug your elbows in — don't let them turn out","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='120,98 138,102 150,104' class='fr'/><polyline points='120,98 100,100 80,100' class='ts'/><polyline points='80,100 62,102 46,102' class='lb'/><circle cx='72' cy='94' r='8' class='hd'/><rect x='34' y='100' width='22' height='6' rx='2' class='rg'/><path d='M58 88 Q49 78 40 88' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='120,98 138,102 150,104' class='fr'/><polyline points='120,98 100,90 82,72' class='ts'/><polyline points='100,90 88,96 74,102' class='lb'/><circle cx='74' cy='64' r='8' class='hd'/><polyline points='120,98 100,100 80,100' class='gh'/><rect x='60' y='100' width='22' height='6' rx='2' class='rg'/><path d='M56 78 Q62 60 68 62' class='ar'/></svg>"],"ca":"Arms slid forward","cb":"Pulling in and pushing up","m":null,"g":"Strength","e":["Blanket"]},{"s":"21 Aug","n":"Child's Pose","r":"","d":30,"st":["Rest."],"c":"","f":null,"g":"Rest","e":[]},{"s":"21 Aug","n":"Modified Bridge","r":"","d":60,"st":["Feet down, hips lifted to a low, comfortable height."],"c":"","f":null,"g":"Rest","e":[]},{"s":"27 Aug","n":"Half bridge, robot arms","r":"","d":60,"st":["Elbows by the sides, bent, palms facing each other, fingertips up","Lift the hips, squeeze the glutes","Shoulders down, head of the humerus down, head back","Interlace the hands behind, shoulder blades together"],"c":"Open the throat","f":null,"g":"Rest","e":[]},{"s":"4 Sep","n":"Head turning with the breath","r":"","d":70,"st":["Legs up on the couch, back on the floor, arms open wide.","Push the back of your head down into the floor and let the shoulders relax.","Reach out towards the sides to glide the shoulder blades apart.","Turn the head slowly from one side to the other, one turn for each breath, and let it get smaller as you go."],"c":"Let each movement last as long as your breath","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='120,96 140,92 150,80' class='fr'/><polyline points='120,96 140,96 152,84' class='lb'/><polyline points='120,96 98,98 74,98' class='ts'/><circle cx='62' cy='98' r='8' class='hd'/><polyline points='88,98 78,86 66,78' class='lb'/><polyline points='88,100 80,110 70,106' class='fr'/><rect x='140' y='74' width='26' height='10' rx='2' class='rg'/><path d='M52 112 Q40 112 44 104' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='120,96 140,92 150,80' class='fr'/><polyline points='120,96 140,96 152,84' class='lb'/><polyline points='120,96 98,98 74,98' class='ts'/><circle cx='62' cy='94' r='8' class='hd'/><polyline points='88,98 78,86 66,78' class='lb'/><polyline points='88,100 80,110 70,106' class='fr'/><rect x='140' y='74' width='26' height='10' rx='2' class='rg'/><path d='M52 84 Q40 84 44 92' class='ar'/></svg>"],"ca":"Arms wide, head centre","cb":"Turning with the breath","m":null,"g":"Rest","e":["Couch"]},{"s":"4 Sep","n":"Blocks under the shoulders","r":"","d":50,"st":["One block flat, and the second one set on its tip so it inclines.","The block goes between your shoulder blades, shoulders on the incline, and the head rests back onto the other one.","Open the arms out to the sides, knees bent, feet flat on the floor, knees together.","If that crowds the shoulders, use the supported fish version instead — one block between the shoulder blades, the other behind the head."],"c":"If your neck feels stuck, leave this one out","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><rect x='76' y='92' width='26' height='12' rx='2' class='rg'/><rect x='52' y='84' width='22' height='20' rx='2' class='rg'/><polyline points='126,92 108,92 92,90' class='ts'/><polyline points='126,92 140,100 132,106' class='fr'/><polyline points='126,92 138,102 128,108' class='lb'/><circle cx='78' cy='88' r='8' class='hd'/><path d='M64 68 Q54 74 64 80' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><rect x='78' y='90' width='26' height='12' rx='2' class='rg'/><rect x='54' y='80' width='22' height='20' rx='2' class='rg'/><polyline points='128,96 108,88 92,84' class='ts'/><polyline points='128,96 142,104 134,108' class='fr'/><polyline points='128,96 140,104 130,108' class='lb'/><circle cx='76' cy='78' r='8' class='hd'/><polyline points='100,86 92,70 86,60' class='lb'/><polyline points='104,88 100,72 96,62' class='fr'/><polyline points='128,96 108,92 92,90' class='gh'/></svg>"],"ca":"Setting the blocks","cb":"Lying back, arms open","m":null,"g":"Rest","e":["2 blocks"]}];
var GROUPS = {"Neck":"Neck","Tspine":"T-spine","Band":"Band","Strap":"Strap","Shoulder":"Shoulders","Side":"Side body","Eyes":"Eyes","Nerve":"Nerve floss","Strength":"Strength","Rest":"Rest"};
var STEPS_OF = [30,45,60,90,120,150];

function svgOf(s){var o="<svg viewBox='0 0 200 124' class='fg'>"+
 "<line x1='8' y1='111' x2='192' y2='111' class='gr'/>";
 var M={g:'gh',f:'fr',l:'lb',t:'ts',b:'bd'};
 s.split(';').forEach(function(p){var i=p.indexOf(':'),k=p.slice(0,i),v=p.slice(i+1);
 if(M[k])o+="<polyline points='"+v+"' class='"+M[k]+"'/>";
 else{var n=v.split(',');
 if(k=='h')o+="<circle cx='"+n[0]+"' cy='"+n[1]+"' r='"+n[2]+"' class='hd'/>";
 else if(k=='r')o+="<circle cx='"+n[0]+"' cy='"+n[1]+"' r='"+n[2]+"' class='rg'/>";
 else if(k=='q')o+="<rect x='"+n[0]+"' y='"+n[1]+"' width='"+n[2]+"' height='"+n[3]+"' rx='2' class='rg'/>";
 else if(k=='a')o+="<path d='M"+n[0]+" "+n[1]+" Q"+n[4]+" "+n[5]+" "+n[2]+" "+n[3]+"' class='ar'/>";}});
 return o+"</svg>";}

var $=function(i){return document.getElementById(i);};
var fmt=function(s){s=Math.max(0,Math.round(s));
 return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
var esc=function(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML;};

/* ---------- selection state, mirrored into the URL ---------- */
var sel = {};                 // index -> duration in seconds
var order = [];               // selection order
var filter = null;

function readHash(){
  var h=(location.hash||"").replace(/^#/,"");
  if(!h) return;
  h.split(",").forEach(function(p){
    var b=p.split("x"), i=parseInt(b[0],10), d=parseInt(b[1],10);
    if(!isNaN(i)&&MOV[i]&&!sel.hasOwnProperty(i)){ sel[i]= (!isNaN(d)&&d>0)?d:MOV[i].d; order.push(i); }
  });
}
function writeHash(){
  var s=order.map(function(i){return i+"x"+sel[i];}).join(",");
  try{ history.replaceState(null,"", s? "#"+s : location.pathname); }catch(e){}
}

function total(){var t=0;order.forEach(function(i){t+=sel[i];});return t;}
function refreshTray(){
  $("tCnt").textContent=order.length;
  $("tDur").textContent=fmt(total());
  $("bGo").disabled = order.length===0;
  var kit=[]; order.forEach(function(i){ (MOV[i].e||[]).forEach(function(x){
    if(kit.indexOf(x)<0) kit.push(x); }); });
  $("needs").innerHTML = kit.length
    ? '<span class="lbl">Need</span>'+kit.map(function(x){
        return '<span class="eq sm">'+esc(x)+"</span>";}).join("") : "";
}

/* ---------- the picker ---------- */
function draw(){
  var h="", last=null;
  MOV.forEach(function(m,i){
    if(filter && m.g!==filter) return;
    if(m.g!==last){ h+='<div class="grp">'+esc(GROUPS[m.g])+"</div>"; last=m.g; }
    var on=sel.hasOwnProperty(i);
    h+='<div class="row'+(on?" on":"")+'" data-i="'+i+'">'+
       '<button class="tick" data-act="tick" aria-label="select"></button>'+
       '<div class="mid" data-act="open"><div class="nm">'+esc(m.n)+"</div>"+
       '<div class="sub">'+esc(m.s)+(m.r?" \u00b7 "+esc(m.r):"")+
       (m.f?"":" \u00b7 no drawing")+"</div>"+
       (m.e&&m.e.length?'<div class="eqs">'+m.e.map(function(x){
         return '<span class="eq sm">'+esc(x)+"</span>";}).join("")+"</div>":"")+"</div>"+
       '<button class="dur" data-act="dur">'+fmt(on?sel[i]:m.d)+"</button></div>"+
       '<div class="steps"><ol>'+m.st.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+
       "</ol>"+(m.c?'<p class="c">'+esc(m.c)+"</p>":"")+"</div>";
  });
  $("list").innerHTML=h;
}
function drawChips(){
  var keys=[]; MOV.forEach(function(m){ if(keys.indexOf(m.g)<0) keys.push(m.g); });
  $("chips").innerHTML='<button data-g="" aria-pressed="'+(!filter)+'">All 66</button>'+
    keys.map(function(k){return '<button data-g="'+k+'" aria-pressed="'+(filter===k)+'">'+
      esc(GROUPS[k])+" "+MOV.filter(function(m){return m.g===k;}).length+"</button>";}).join("");
}

$("chips").onclick=function(e){
  var b=e.target.closest("button"); if(!b) return;
  filter=b.getAttribute("data-g")||null; drawChips(); draw();
};
$("list").onclick=function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var row=b.closest(".row"), i=parseInt(row.getAttribute("data-i"),10), act=b.getAttribute("data-act");
  if(act==="open"){ row.classList.toggle("open"); return; }
  if(act==="tick"){
    if(sel.hasOwnProperty(i)){ delete sel[i]; order=order.filter(function(x){return x!==i;}); }
    else { sel[i]=MOV[i].d; order.push(i); }
  }
  if(act==="dur"){
    if(!sel.hasOwnProperty(i)){ sel[i]=MOV[i].d; order.push(i); }
    var k=STEPS_OF.indexOf(sel[i]); sel[i]=STEPS_OF[(k+1)%STEPS_OF.length];
  }
  writeHash(); draw(); refreshTray();
};
$("bClear").onclick=function(){ sel={}; order=[]; writeHash(); draw(); refreshTray(); };
$("bCopy").onclick=function(){
  var url=location.origin+location.pathname+(order.length?"#"+order.map(function(i){
    return i+"x"+sel[i];}).join(","):"");
  var ok=function(){ toast("Link copied"); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(ok,function(){ toast("Copy the address bar"); });
  } else toast("Copy the address bar");
};
function toast(t){ $("toastTxt").textContent=t; $("toast").className="on";
  setTimeout(function(){ $("toast").className=""; },2200); }

/* ---------- audio + speech ---------- */
var actx=null,sound=true;
function ac(){ if(!sound) return null;
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
   if(actx.state==="suspended") actx.resume(); return actx; }catch(e){ return null; } }
function tone(f,w,d,v){ var a=ac(); if(!a) return;
  try{ var o=a.createOscillator(),g=a.createGain(); o.type="sine"; o.frequency.value=f;
   g.gain.setValueAtTime(0.0001,a.currentTime+w);
   g.gain.exponentialRampToValueAtTime(v||0.16,a.currentTime+w+0.015);
   g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+w+d);
   o.connect(g);g.connect(a.destination);o.start(a.currentTime+w);o.stop(a.currentTime+w+d+0.05);
  }catch(e){} }
var chime=function(){tone(660,0,0.55);}, dbl=function(){tone(600,0,0.4);tone(760,0.17,0.45);},
    tick=function(){tone(430,0,0.11,0.09);},
    fan=function(){[523,659,784,1046].forEach(function(f,i){tone(f,i*0.13,0.5);});};
var voice=null,vq=[],vbusy=false;
function loadVoice(){ try{ var vs=window.speechSynthesis?speechSynthesis.getVoices():[];
  if(!vs||!vs.length) return;
  var w=["Samantha","Karen","Serena","Google UK English Female","Google US English","Daniel","Alex"];
  for(var i=0;i<w.length;i++) for(var j=0;j<vs.length;j++) if(vs[j].name===w[i]){voice=vs[j];return;}
  for(var k=0;k<vs.length;k++) if(/^en/i.test(vs[k].lang)){voice=vs[k];return;} }catch(e){} }
function vnext(){ if(vbusy||!vq.length) return; var t=vq.shift();
  try{ var u=new SpeechSynthesisUtterance(t); if(voice)u.voice=voice; u.rate=0.97;
   vbusy=true; u.onend=u.onerror=function(){vbusy=false;vnext();}; speechSynthesis.speak(u);
  }catch(e){vbusy=false;} }
function say(t){ if(!sound||!window.speechSynthesis) return; vq.push(t); vnext(); }
function hush(){ vq=[];vbusy=false; try{speechSynthesis.cancel();}catch(e){} }
var wake=null;
function lock(){ try{ if(navigator.wakeLock&&navigator.wakeLock.request)
  navigator.wakeLock.request("screen").then(function(w){wake=w;},function(){}); }catch(e){} }
function unlock(){ try{ if(wake&&wake.release){wake.release();wake=null;} }catch(e){} }

/* ---------- runner ---------- */
var Q=[],idx=0,running=false,paused=true,t0=0,acc=0,fired={},raf=null;
var GAP=3.6;
function show(i){
  idx=i; var b=Q[i];
  $("title").textContent=b.n;
  $("reps").textContent=b.r||"";
  $("kit").innerHTML=(b.e||[]).map(function(x){return '<span class="eq">'+esc(x)+"</span>";}).join("");
  $("art").innerHTML = b.f ? ("<figure>"+svgOf(b.f[0])+'<figcaption>'+esc(b.ca||"")+"</figcaption></figure>"+
                              "<figure>"+svgOf(b.f[1])+'<figcaption>'+esc(b.cb||"")+"</figcaption></figure>") : "";
  $("corr").textContent=b.c||"";
  $("of").textContent=String(i+1).padStart(2,"0")+" / "+String(Q.length).padStart(2,"0");
  $("cue").innerHTML='<ol class="rs">'+b.st.map(function(x){
    return '<li class="later">'+esc(x)+"</li>";}).join("")+"</ol>";
  var sp=$("spine").children;
  for(var k=0;k<sp.length;k++) sp[k].className = k<i?"done":(k===i?"now":"");
  fired={};acc=0;t0=performance.now();
  $("clock").textContent=fmt(b.d); $("barI").style.width="0%";
  chime(); say(b.n);
}
function body(){
  var b=Q[idx], e=acc+(paused?0:(performance.now()-t0)/1000), left=b.d-e;
  $("clock").textContent=fmt(left);
  $("barI").style.width=Math.min(100,(e/b.d)*100)+"%";
  var lis=$("cue").getElementsByTagName("li");
  var live=Math.min(lis.length,Math.floor(e/GAP)+1);
  for(var k=0;k<lis.length;k++)
    lis[k].className = k<live-1?"past":(k===live-1?"":"later");
  for(var m=0;m<live;m++){ if(!fired["s"+m]){ fired["s"+m]=1; if(m>0) say(b.st[m]); } }
  if(b.m && e>=b.d/2 && !fired.mid){ fired.mid=1; dbl(); say(b.m); }
  [3,2,1].forEach(function(n){ if(left<=n&&left>n-1&&!fired["c"+n]){fired["c"+n]=1;tick();} });
  if(left<=0){
    if(idx+1<Q.length){ var nx=idx+1; paused=true; setTimeout(function(){show(nx);},250); }
    else finish();
  }
}
function loop(){ try{ if(running&&!paused) body(); }catch(err){}
  if(running) raf=requestAnimationFrame(loop); }
function finish(){ running=false;paused=true;unlock();fan();
  $("run").className="";$("done").className="on";
  var t=Q.reduce(function(a,b){return a+b.d;},0);
  $("doneP").textContent=Q.length+" movements, "+fmt(t)+".";
  say("That's the session."); }
function start(){
  Q=order.map(function(i){ var m=MOV[i],c={}; for(var k in m) c[k]=m[k]; c.d=sel[i]; return c; });
  if(!Q.length) return;
  $("spine").innerHTML=Q.map(function(){return "<i></i>";}).join("");
  $("pick").style.display="none"; $("tray").style.display="none";
  $("done").className=""; $("run").className="on";
  running=true;paused=false;loadVoice();lock();show(0);
  if(raf) cancelAnimationFrame(raf); loop();
}
function goHome(){ running=false;paused=true;unlock();hush();
  if(raf){cancelAnimationFrame(raf);raf=null;}
  $("run").className="";$("done").className="";
  $("pick").style.display="";$("tray").style.display=""; }

$("bGo").onclick=start; $("again").onclick=start;
$("home2").onclick=goHome; $("home3").onclick=goHome;
$("pause").onclick=function(){
  if(paused){t0=performance.now();paused=false;$("pause").textContent="Pause";}
  else{acc+=(performance.now()-t0)/1000;paused=true;$("pause").textContent="Resume";hush();} };
$("next").onclick=function(){ hush();
  if(idx+1<Q.length){paused=false;$("pause").textContent="Pause";show(idx+1);} else finish(); };
$("prev").onclick=function(){ hush();
  if(idx>0){paused=false;$("pause").textContent="Pause";show(idx-1);} };
$("sound").onclick=function(){ sound=!sound;
  $("sound").textContent=sound?"Sound on":"Sound off"; if(!sound) hush(); };
$("art").onclick=function(){};
document.addEventListener("visibilitychange",function(){ if(!document.hidden) lock(); });
try{ if(window.speechSynthesis) speechSynthesis.onvoiceschanged=loadVoice; }catch(e){}

/* bootstrap last */
readHash(); drawChips(); draw(); refreshTray();
})();
</script></body></html>
