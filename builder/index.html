rsor:pointer;display:flex;align-items:center;justify-content:center}.row .th img{width:100%;height:100%;object-fit:cover;display:block}.row .th svg.fg{border-radius:0;width:150%;max-width:none}.row .th.none::after{content:"";width:14px;height:1.5px;background:#3E5A4B;border-radius:1px}.row .mid{flex:1;min-width:0;cursor:pointer}.row .nm{font-size:15.5px;line-height:1.3}.row .sub{font-size:11.5px;color:var(--dim);font-family:var(--mono);letter-spacing:.04em;margin-top:2px}.eq{display:inline-flex;align-items:center;gap:5px;background:var(--calm);color:#26200F;border-radius:4px;padding:3px 8px 3px 6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-family:var(--sans)}.eq::before{content:"";width:8px;height:8px;background:#26200F;border-radius:1.5px;flex:0 0 8px}.eq.sm{font-size:9.5px;padding:2px 6px 2px 5px;gap:4px}.eq.sm::before{width:6px;height:6px;flex:0 0 6px}.row .eqs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}#kit{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 13px}#kit:empty{display:none}#needs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}#needs .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.row .dur{font-family:var(--mono);font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;margin-top:1px}.row.on .dur{color:var(--calm);border-color:#4A6455}.steps{display:none;padding:2px 0 4px 89px}.row.open + .steps{display:block}.steps ol{margin:0;padding:0 0 0 16px;font-size:14px;color:#C6D3C9}.steps li{padding:0 0 4px}.steps .c{margin:6px 0 0;font-size:13.5px;color:var(--calm);font-style:italic}#tray{position:fixed;left:0;right:0;bottom:0;background:#16261F;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}#tray .in{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}#tray .cnt{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}#tray .cnt b{color:var(--chalk);font-family:var(--mono);font-size:16px}#tray button{background:var(--surface);border:1px solid var(--line);color:var(--chalk);border-radius:10px;padding:11px 14px;font-size:14px;font-family:var(--sans);cursor:pointer}#tray button.pri{background:var(--signal);color:#0F1D17;border-color:var(--signal);font-weight:700}#tray button:disabled{opacity:.4;cursor:default}#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-140%);top:12px;z-index:50;background:var(--calm);color:#26200F;padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;transition:transform .3s}#toast.on{transform:translateX(-50%) translateY(0)}#run{display:none}#run.on{display:block}.runtop{display:flex;align-items:center;gap:12px;padding:14px 18px 8px;max-width:680px;margin:0 auto}.runtop .of{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.08em}.runtop .sp{flex:1}.iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 11px;font-size:12.5px;font-family:var(--sans);cursor:pointer}.stage{display:flex;gap:14px;max-width:680px;margin:0 auto;padding:0 18px 26px}.spine{width:11px;flex:0 0 11px;display:flex;flex-direction:column;gap:3px;padding-top:4px}.spine i{flex:1;background:#233A30;border-radius:6px;min-height:4px;display:block}.spine i.done{background:#3C6350}.spine i.now{background:var(--signal)}.main{flex:1;min-width:0}#title{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.12;margin:0 0 3px}#reps{font-family:var(--mono);font-size:12px;color:var(--calm);letter-spacing:.06em;margin:0 0 12px;min-height:15px}#art{display:flex;gap:8px;margin:0 0 14px;cursor:zoom-in}#art:empty{display:none}#art figure{flex:1;min-width:0;margin:0}#art figcaption{font-size:10.5px;color:var(--dim);margin-top:4px}#art img{display:block;width:100%;border-radius:9px;background:#16261F}#art figure.solo{max-width:340px;margin:0 auto}svg.fg{display:block;width:100%;heig  elbow straightening as it travels. The right arm stays back and still.","Since it's the left arm working, turn your eyes sharp right and hold them there, and see if it improves the range.","Ten reps, then switch at the chime: right arm up, eyes sharp left."],"c":"Close the ribs and isolate the movement to the arm","f":null,"ca":"Ribs closed, setting up","cb":"Arm reaching back","m":"Switch — right arm up, eyes left","g":"Band","e":["Loop band"]},{"s":"4 Sep","n":"Cow face arms with the band","r":"5 each side","d":90,"st":["Left arm on top — that is the arm that does the work. The right one only anchors.","The left arm externally rotates and comes up and over, elbow hugging in towards your ear, hand dropping down your back.","The right arm internally rotates and goes low behind your back. It only holds the band and pulls down for resistance — it does not move.","Now bend and straighten the left elbow five times and let the triceps do the job. The right hand stays exactly where it is.","Then push both arms backwards together. At the chime, swap: right arm on top and working, left arm anchoring."],"c":"Don't let the top elbow splay out — hug it in towards your ear","f":null,"ca":"Top elbow bent","cb":"Straightening, pushing back","m":"Switch — right arm on top","g":"Band","e":["Loop band"],"img":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAHwAcwDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAgQAAQMFBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAfaAaiRZpXn06IzHry3lXWS7S3Po3ic1nPDbLn0C6KLuiqSWSriVLpZJZUuiXIWBiBLhLpKbenMblYlXrngBZyxXdTLNHVWZsL6Rhvk7a5phrq6XULuQklnRTY5O+VsQMb32q+vPermpSbyPPZaXKzy0zzoLos2yoqkGWFAqXSZQ1mVG0kSSWWGmYF1Sr8o3OXuu4PPDuqzPbzrYbYayCDqmZhrk/JwzIbXGUOgN64a6ut5w1vKG15AO4JPa58x6YZ10HbHtzKYbISD6GOjBiVzhltlneZCWaRUVmOgkskhJVky0zNpLSrl1eegAIveXz3b7PkSmfS4t /* ---------- selection state, mirrored into the URL ---------- */
var sel = {};                 // index -> duration in seconds

function readHash(){
  var h=(location.hash||"").replace(/^#/,"");
  if(!h) return;
  h.split(",").forEach(function(p){
    var b=p.split("x"), i=parseInt(b[0],10), d=parseInt(b[1],10);
    if(!isNaN(i)&&MOV[i]&&!sel.hasOwnProperty(i)){ sel[i]= (!isNaN(d)&&d>0)?d:MOV[i].d; order.push(i); }
  });
}
function writeHash(){
  var s=order.map(function(i){return i+"x"+sel[i];}).join(",");
  try{ history.replaceState(null,"", s? "#"+s : location.pathname); }catch(e){}
}

function total(){var t=0;order.forEach(function(i){t+=sel[i];});return t;}
function refreshTray(){
  $("tCnt").textContent=order.length;
  $("tDur").textContent=fmt(total());
  $("bGo").disabled = order.length===0;
  var kit=[]; order.forEach(function(i){ (MOV[i].e||[]).forEach(function(x){
    if(kit.indexOf(x)<0) kit.push(x); }); });
  $("needs").innerHTML = kit.length
    ? '<span class="lbl">Need</span>'+kit.map(function(x){
        return '<span class="eq sm">'+esc(x)+"</span>";}).join("") : "";
}

function thumbOf(m){
  if(m.img&&m.img.length) return '<div class="th" data-act="open"><img loading="lazy" alt="" src="'+m.img[0]+'"></div>';
  if(m.f) return '<div class="th" data-act="open">'+svgOf(m.f[0])+'</div>';
  return '<div class="th none" data-act="open"></div>';
}
/* ---------- the picker ---------- */
function draw(){
  var h="", last=null;
  MOV.forEach(function(m,i){
    if(filter && m.g!==filter) return;
    if(m.g!==last){ h+='<div class="grp">'+esc(GROUPS[m.g])+"</div>"; last=m.g; }
    var on=sel.hasOwnProperty(i);
    h+='<div class="row'+(on?" on":"")+'" data-i="'+i+'">'+
       '<button class="tick" data-act="tick" aria-label="select"></button>'+thumbOf(m)+
       '<div class="mid" data-act="open"><div class="nm">'+esc(m.n)+"</div>"+
       '<div class="sub">'+esc(m.s)+(m.r?" \u00b7 "+esc(m.r):"")+
       (m.img?" \u00b7 photo":"")+"</div>"+
       (m.e&&m.e.length?'<div class="eqs">'+m.e.map(function(x){
         return '<span class="eq sm">'+esc(x)+"</span>";}).join("")+"</div>":"")+"</div>"+
       '<button class="dur" data-act="dur">'+fmt(on?sel[i]:m.d)+"</button></div>"+
       '<div class="steps"><ol>'+m.st.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+
       "</ol>"+(m.c?'<p class="c">'+esc(m.c)+"</p>":"")+"</div>";
  });

function drawChips(){
  var keys=[]; MOV.forEach(function(m){ if(keys.indexOf(m.g)<0) keys.push(m.g); });
  $("chips").innerHTML='<button data-g="" aria-pressed="'+(!filter)+'">All 66</button>'+
    keys.map(function(k){return '<button data-g="'+k+'" aria-pressed="'+(filter===k)+'">'+

$("chips").onclick=function(e){
  var b=e.target.closest("button"); if(!b) return;
  filter=b.getAttribute("data-g")||null; drawChips(); draw();
};
$("list").onclick=function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var row=b.closest(".row"), i=parseInt(row.getAttribute("data-i"),10), act=b.getAttribute("data-act");
  if(act==="open"){ row.classList.toggle("open"); return; }
  if(act==="tick"){
    if(sel.hasOwnProperty(i)){ delete sel[i]; order=order.filter(function(x){return x!==i;}); }
    else { sel[i]=MOV[i].d; order.push(i); }
  }
  if(act==="dur"){
    if(!sel.hasOwnProperty(i)){ sel[i]=MOV[i].d; order.push(i); }
    var k=STEPS_OF.indexOf(sel[i]); sel[i]=STEPS_OF[(k+1)%STEPS_OF.length];
  }

$("bClear").onclick=function(){ sel={}; order=[]; writeHash(); draw(); refreshTray(); };

var actx=null,sound=true;
function ac(){ if(!sound) return null;
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
   if(actx.state==="suspended") actx.resume(); return actx; }catch(e){ return null; } }
function tone(f,w,d,v){ var a=ac(); if(!a) return;
  try{ var o=a.createOscillator(),g=a.createGain(); o.type="sine"; o.frequency.value=f;
   g.gain.setValueAtTime(0.0001,a.currentTime+w);
   g.gain.exponentialRampToValueAtTime(v||0.16,a.currentTime+w+0.015);
   g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+w+d);
   o.connect(g);g.connect(a.destination);o.start(a.currentTime+w);o.stop(a.currentTime+w+d+0.05);
  }catch(e){} }
var chime=function(){tone(660,0,0.55);}, dbl=function(){tone(600,0,0.4);tone(760,0.17,0.45);},
    tick=function(){tone(430,0,0.11,0.09);},
    fan=function(){[523,659,784,1046].forEach(function(f,i){tone(f,i*0.13,0.5);});};
var voice=null,vq=[],vbusy=false;
function loadVoice(){ try{ var vs=window.speechSynthesis?speechSynthesis.getVoices():[];
  if(!vs||!vs.length) return;
  var w=["Samantha","Karen","Serena","Google UK English Female","Google US English","Daniel","Alex"];
  for(var i=0;i<w.length;i++) for(var j=0;j<vs.length;j++) if(vs[j].name===w[i]){voice=vs[j];return;}
  for(var k=0;k<vs.length;k++) if(/^en/i.test(vs[k].lang)){voice=vs[k];return;} }catch(e){} }
function vnext(){ if(vbusy||!vq.length) return; var t=vq.shift();
  try{ var u=new SpeechSynthesisUtterance(t); if(voice)u.voice=voice; u.rate=0.97;
   vbusy=true; u.onend=u.onerror=function(){vbusy=false;vnext();}; speechSynthesis.speak(u);
  }catch(e){vbusy=false;} }
function say(t){ if(!sound||!window.speechSynthesis) return; vq.push(t); vnext(); }
function hush(){ vq=[];vbusy=false; try{speechSynthesis.cancel();}catch(e){} }

function unlock(){ try{ if(wake&&wake.release){wake.release();wake=null;} }catch(e){} }

/* ---------- runner ---------- */
var Q=[],idx=0,running=false,paused=true,t0=0,acc=0,fired={},raf=null;
var GAP=3.6;
function show(i){
  idx=i; var b=Q[i];
  $("title").textContent=b.n;
  $("reps").textContent=b.r||"";
  $("kit").innerHTML=(b.e||[]).map(function(x){return '<span class="eq">'+esc(x)+"</span>";}).join("");
  $("art").innerHTML = artOf(b);

  $("cue").innerHTML='<ol class="rs">'+b.st.map(function(x){
    return "<li>"+esc(x)+"</li>";}).join("")+"</ol>";
  var sp=$("spine").children;
  for(var k=0;k<sp.length;k++) sp[k].className = k<i?"done":(k===i?"now":"");
  fired={};acc=0;t0=performance.now();
  paused=false; $("pause").textContent="Pause";   // a block always starts running
  $("clock").textContent=fmt(b.d); $("barI").style.width="0%";
  chime(); say(b.n);
}
function body(){
  var b=Q[idx], e=acc+(paused?0:(performance.now()-t0)/1000), left=b.d-e;
  $("clock").textContent=fmt(left);
  $("barI").style.width=Math.min(100,(e/b.d)*100)+"%";
  var lis=$("cue").getElementsByTagName("li");
  var live=Math.min(lis.length,Math.floor(e/GAP)+1);
  for(var k=0;k<lis.length;k++)
    lis[k].className = k<live-1?"past":(k===live-1?"now":"");
  for(var m=0;m<live;m++){ if(!fired["s"+m]){ fired["s"+m]=1; if(m>0) say(b.st[m]); } }
  if(b.m && e>=b.d/2 && !fired.mid){ fired.mid=1; dbl(); say(b.m); }
  [3,2,1].forEach(function(n){ if(left<=n&&left>n-1&&!fired["c"+n]){fired["c"+n]=1;tick();} });
  if(left<=0){
    if(idx+1<Q.length){ var nx=idx+1; paused=true; setTimeout(function(){show(nx);},250); }
    else finish();
  }
}
function loop(){ try{ if(running&&!paused) body(); }catch(err){}
  if(running) raf=requestAnimationFrame(loop); }
function finish(){ running=false;paused=true;unlock();fan();
  $("run").className="";$("done").className="on";
  var t=Q.reduce(function(a,b){return a+b.d;},0);
  $("doneP").textContent=Q.length+" movements, "+fmt(t)+".";
  say("That's the session."); }
function start(){
  Q=order.map(function(i){ var m=MOV[i],c={}; for(var k in m) c[k]=m[k]; c.d=sel[i]; return c; });

  $("spine").innerHTML=Q.map(function(){return "<i></i>";}).join("");
  $("pick").style.display="none"; $("tray").style.display="none";
  $("done").className=""; $("run").className="on";

  if(raf) cancelAnimationFrame(raf); loop();
}

  $("pick").style.display="";$("tray").style.display=""; }

$("bGo").onclick=start; $("again").onclick=start;
$("home2").onclick=goHome; $("home3").onclick=goHome;
$("pause").onclick=function(){
  if(paused){t0=performance.now();paused=false;$("pause").textContent="Pause";}
  else{acc+=(performance.now()-t0)/1000;paused=true;$("pause").textContent="Resume";hush();} };
$("next").onclick=function(){ hush();
  if(idx+1<Q.length){paused=false;$("pause").textContent="Pause";show(idx+1);} else finish(); };
$("prev").onclick=function(){ hush();
  if(idx>0){paused=false;$("pause").textContent="Pause";show(idx-1);} };
$("sound").onclick=function(){ sound=!sound;
  $("sound").textContent=sound?"Sound on":"Sound off"; if(!sound) hush(); };
$("art").onclick=function(){};
document.addEventListener("visibilitychange",function(){ if(!document.hidden) lock(); });
try{ if(window.speechSynthesis) speechSynthesis.onvoiceschanged=loadVoice; }catch(e){}

readHash(); drawChips(); draw(); refreshTray();
