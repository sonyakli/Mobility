ch \u2014 right arm on top","ca":"Top elbow bent","cb":"Straightening, pushing back","s":["Left arm on top \u2014 that is the arm that does the work. The right one only anchors.","The left arm externally rotates and comes up and over, elbow hugging in towards your ear, hand dropping down your back.","The right arm internally rotates and goes low behind your back. It only holds the band and pulls down for resistance \u2014 it does not move.","Now bend and straighten the left elbow five times and let the triceps do the job. The right hand stays exactly where it is.","Then push both arms backwards together. At the chime, swap: right arm on top and working, left arm anchoring."],"c":"Don't let the top elbow splay out \u2014 hug it in towards your ear","e":["Loop band"]},{"k":8,"g":"Eyes and balance","n":"Steady thumb, head side to side","r":"20 seconds","df":25,"ds":25,"m":null,"ca":"Head turned one way","cb":"And the other","s":["Thumb up in front of you, or find a steady point on the wall.","Keep the gaze on it \u2014 the eyes don't move, only the head.","Turn the head side to side, and keep the target clear rather than blurred."],"c":"Keep your focus on the thumb \u2014 only the head moves","e":[]},{"k":9,"g":"","n":"Steady thumb, head up and down","r":"20 seconds","df":25,"ds":25,"m":null,"ca":"Head lifting","cb":"Head lowering","s":["Same steady gaze on the same target.","Now the head travels up and down instead of turning.","If it feels easy you can increase the speed \u2014 but the target has to stay clear."],"c":"Make sure you see the target clearly and not blurred","e":[]},{"k":10,"g":"","n":"Head steady, body turns","r":"20 seconds","df":25,"ds":25,"m":null,"ca":"Turning one way","cb":"Turning the other","s":["Stand up, far enough back that you can see your target easily.","This one reverses it \u2014 the head stays completely still and the body moves.","Turn the torso left and right underneath a steady head. You can move your feet too."],"c":"Head steady. The he head backwards.","Squeeze the glutes and engage the core so the lower back doesn't collapse."],"c":"Use your back muscles instead of your arms","e":[]},{"k":15,"g":"","n":"Foam roller between the elbows","r":"hold 5","df":60,"ds":0,"m":null,"ca":"Roller in place","cb":"Squeeze and lift","s":["Lie on your belly and take the foam roller behind you, then bring one hand closer and then the other.","Your hands don't touch the floor \u2014 you should feel the roller in between your elbows.","Squeeze it and lift: glutes on, pubic bone pressing down, everything lifting through the back muscles.","Chin parallel to the chest so the back of the neck stays long. Hold it there for five."],"c":"Elbows hug in","e":["Foam roller"]},{"k":16,"g":"","n":"Sliding blanket, child's pose to cobra","r":"","df":110,"ds":0,"m":null,"ca":"Arms slid forward","cb":"Pulling in and pushing up","s":["Blanket in front of the mat with your hands on the sliding surface. Start in child's pose.","Round the back into cat with the tailbone tucked, then find your cobra \u2014 toes down or pointed, whichever you prefer.","Lower down very slowly and slide the blanket forward, keeping the elbows straight.","Pull everything in as far as you can. When you can't pull any further, that's the moment to bend the elbows and push up into cobra.","Then round the back and travel back to child's pose."],"c":"Hug your elbows in \u2014 don't let them turn out","e":["Blanket"]},{"k":17,"g":"Lunge with the strap","n":"Low lunge, right arm circles","r":"hold 5","df":110,"ds":60,"m":null,"ca":"Half split, reaching forward","cb":"Arm circling behind","s":["From down dog take the right leg up and back, bend the knee and turn the hips open, then step the right foot outside the right hand. Left knee down.","Make a small loop in the strap and hook it around the left foot, holding it with the right hand in external rotation, palm facing up.","Shift the hips back into a half split, right hand reaching towards the right toe, front leg straight.","Then bend the front knee and take the arm behind you \u2014 the arm makes a half circle, behind you and around.","On the last round stay there, bend the knee, walk the hand down the strap and push the leg back. Head back, hold for five."],"c":"Leave enough room to use your leg to push the arm","e":["Strap"]},{"k":18,"g":"","n":"Nerve floss, right arm","r":"\u00d75","df":45,"ds":40,"m":null,"ca":"Arm pushing away, head tilted","cb":"Elbow in, head to centre","s":["Come to a seat and take the right arm out to the side, the shoulder pressing down away from your ear.","Tilt the head to the left, away from that arm, and you'll feel the tingling travelling down.","Then bend the right elbow back in, elbow in line with the shoulder, and bring the head back to neutral.","Push away, and in. Five times."],"c":"This is the one for when your neck feels stiff at work","e":[]},{"k":19,"g":"","n":"Low lunge, left arm circles","r":"hold 5","df":110,"ds":60,"m":null,"ca":"Reaching forward","cb":"Arm circling back","s":["Down dog with the left leg lifted. Turn the hips, point the left toes back and let the right leg extend. One more breath there.","Pull the left knee into the chest, round the back and step the left foot outside the left hand.","Hook the strap to the back foot and keep the left arm in external rotation; the right hand can come out to the side.","Reach, shift the hips back towards the left foot, then bend the knee and take the arm behind \u2014 three circles, letting the head travel back.","Last round: stay up, take the strap over your shoulder like a backpack so the elbow faces in and up, and push the leg back. Hold for five."],"c":"The angle of the arm changes as it circles","e":["Strap"]},{"k":20,"g":"","n":"Nerve floss, left arm","r":"\u00d75","df":45,"ds":40,"m":null,"ca":"Arm pushing out, head tilted","cb":"Coming back in","s":["The left arm pushes out to the side, shoulder pressing down away from the ear.","The head tilts to the right, away from the working arm.","Feel the tingling in the arm, then come back \u2014 elbow in, head to centre.","Push out and back in, five reps."],"c":"Shoulder stays down as the arm pushes out","e":[]},{"k":21,"g":"","n":"Shoulder flossing again","r":"","df":45,"ds":35,"m":null,"ca":"Arms up in front","cb":"Travelling behind","s":["Shake out the shoulders and pick the band back up.","Same as the very first time: pinkies turned in, ribs closed, arms up and then behind you.","Add the extension as well, and notice what's changed."],"c":"Do you feel more range of motion?","e":["Loop band"]},{"k":22,"g":"On the wheel","n":"Wheel and band, hips up and down","r":"\u00d710","df":110,"ds":70,"m":null,"ca":"Hips lowering, arms pushing","cb":"Hips lifted","s":["Thread the loop inside the wheel and take both edges over to the side, so the band is equal on both ends.","Lie back over the wheel \u2014 head and shoulder blades both supported \u2014 elbows in, head back. Mind your hair.","Lift the hips like a hip thrust, then extend the arms fully out against the band.","Keep the hands travelling down towards the floor as you lower the bum down. You don't have to go all the way.","Hips up, tuck the tailbone, and go again. Ten reps."],"c":"The elbows want to come up \u2014 keep them in","e":["Wheel","Loop band"]},{"k":23,"g":"","n":"Elbows bent on the wheel","r":"","df":50,"ds":25,"m":null,"ca":"Draped back, elbows bent","cb":"Coming up","s":["Let go of the strap and hold the sides of the wheel instead.","Bend the elbows and bring them down, the way you would in Dwi Pada.","Lengthen the side body first so there's space in the lumbar spine before you go back."],"c":"The backbend lives mostly in the upper thoracic spine","e":["Wheel"]},{"k":24,"g":"Closing","n":"Supine twist, arm overhead","r":"3 each side","df":100,"ds":45,"m":"Switch sides","ca":"Arm reaching forward","cb":"Up and over the ear","s":["On your back with the knees over to one side \u2014 hips, knees and ankles all in one line, head supported.","The top arm reaches forward first, then up and over your ear, and then back to the front.","Three reps, slowly, and let the head turn with the arm.","At the halfway chime, switch sides."],"c":"Take the arm over towards the couch, then turn back","e":[]},{"k":25,"g":"","n":"Breathe into the top ribs","r":"","df":45,"ds":25,"m":null,"ca":"Hand resting on hand","cb":"Expanding the top side","s":["Stay in the twist and rest the top hand on the one underneath.","Breathe towards the top ribcage and expand that area.","Keep inhaling, keep inhaling, hold it at the top, and release.","Then try the arm one more time and see how much further it travels."],"c":"Breathe and expand into the top side \u2014 more, more, more","e":[]},{"k":26,"g":"","n":"Head turning with the breath","r":"","df":70,"ds":0,"m":null,"ca":"Arms wide, head centre","cb":"Turning with the breath","s":["Legs up on the couch, back on the floor, arms open wide.","Push the back of your head down into the floor and let the shoulders relax.","Reach out towards the sides to glide the shoulder blades apart.","Turn the head slowly from one side to the other, one turn for each breath, and let it get smaller as you go."],"c":"Let each movement last as long as your breath","e":["Couch"]},{"k":27,"g":"","n":"Blocks under the shoulders","r":"","df":50,"ds":0,"m":null,"ca":"Setting the blocks","cb":"Lying back, arms open","s":["One block flat, and the second one set on its tip so it inclines.","The block goes between your shoulder blades, shoulders on the incline, and the head rests back onto the other one.","Open the arms out to the sides, knees bent, feet flat on the floor, knees together.","If that crowds the shoulders, use the supported fish version instead \u2014 one block between the shoulder blades, the other behind the head."],"c":"If your neck feels stuck, leave this one out","e":["2 blocks"]}];;

sp[k].className = k < i ? "done" : (k === i ? "now" : "");
fired = {}; acc = 0; t0 = performance.now();
paused = false;                       // a block always starts running
$("pause").textContent = "Pause";
$("clock").textContent = fmt(b.d);
$("barI").style.width = "0%";
chimeOne();
say(b.n);
};
var banner = function(t){
$("bannerTxt").textContent = t;
$("banner").className = "on";
setTimeout(function(){ $("banner").className = ""; }, 4200);
};
var body = function(){
var b = B[idx];
var e = acc + (paused ? 0 : (performance.now() - t0) / 1000);
var left = b.d - e;
$("clock").textContent = fmt(left);
$("barI").style.width = Math.min(100, (e / b.d) * 100) + "%";
var lis = $("cue").getElementsByTagName("li");
var live = Math.min(lis.length, Math.floor(e / STEP_GAP) + 1);
for (var k = 0; k < lis.length; k++){
if (k < live - 1)      lis[k].className = "past";   // done, still readable
else if (k === live-1) lis[k].className = "now";    // lit white
else                   lis[k].className = "";       // upcoming, still readable
}
for (var m = 0; m < live; m++){
var key = "s" + m;
if (!fired[key]) { fired[key] = 1; if (m > 0) say(b.s[m]); }
}
if (b.m && e >= b.d / 2 && !fired.mid){
fired.mid = 1; chimeTwo(); banner(b.m); say(b.m);
}
[3,2,1].forEach(function(n){
if (left <= n && left > n - 1 && !fired["c" + n]) { fired["c" + n] = 1; tick(); }
});
if (left <= 0){
if (ENC[b.k]) { $("enc").textContent = ENC[b.k]; $("enc").className = "on"; say(ENC[b.k]); }
if (idx + 1 < B.length){
var nx = idx + 1;
setTimeout(function(){ show(nx); }, ENC[b.k] ? 2100 : 250);
paused = true;
} else {
finish();
}
}
};
var loop = function(){
try { if (running && !paused) body(); } catch(err){ /* never stop the clock */ }
if (running) raf = requestAnimationFrame(loop);
};
var finish = function(){
running = false; paused = true; unlock(); fanfare();
$("run").className = ""; $("done").className = "on";
var tot = B.reduce(function(a, b){ return a + b.d; }, 0);
$("doneP").textContent = B.length + " blocks, " + fmt(tot) + ".";
say("That's the session.");
};
var start = function(){
pick();
$("spine").innerHTML = B.map(function(){ return "<i></i>"; }).join("");
$("home").style.display = "none";
$("done").className = "";
$("run").className = "on";
running = true; paused = false;
loadVoice(); lock();
show(0);
if (raf) cancelAnimationFrame(raf);
loop();
};
var goHome = function(){
running = false; paused = true; unlock(); hush();
if (raf) { cancelAnimationFrame(raf); raf = null; }
$("run").className = ""; $("done").className = "";
$("home").style.display = "";
};
$("mFull").onclick  = function(){ setMode("full"); };
$("mShort").onclick = function(){ setMode("short"); };
$("go").onclick     = start;
$("again").onclick  = start;
$("home2").onclick  = goHome;
$("home3").onclick  = goHome;
$("pause").onclick = function(){
if (paused){ t0 = performance.now(); paused = false; $("pause").textContent = "Pause"; }
else { acc += (performance.now() - t0) / 1000; paused = true; $("pause").textContent = "Resume"; hush(); }
};
$("next").onclick = function(){
hush();
if (idx + 1 < B.length){ paused = false; $("pause").textContent = "Pause"; show(idx + 1); }
else finish();
};
$("prev").onclick = function(){
hush();
if (idx > 0){ paused = false; $("pause").textContent = "Pause"; show(idx - 1); }
};
$("sound").onclick = function(){
sound = !sound;
$("sound").textContent = sound ? "Sound on" : "Sound off";
if (!sound) hush();
};
$("art").onclick = function(){
$("lbIn").innerHTML = $("art").innerHTML;
$("lb").className = "on";
};
$("lb").onclick = function(){ $("lb").className = ""; };
document.addEventListener("visibilitychange", function(){ if (!document.hidden) lock(); });
try { if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoice; } catch(e){}
setMode("full");
})();</script></body></html>
