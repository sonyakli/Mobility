rms up in front","cb":"Travelling behind","s":["Hold the band with the pinkies turned towards one another, and a light resistance already in it.","Inhale, reach the arms up, then take them behind you.","Keep the ribs closed so the back stays straight — the motion comes only from the shoulders, not from a backbend.","Elevate the shoulders and keep pushing the elbows into a straight position."],"c":"The shoulder shouldn't come forward to bring the band back","e":["Loop band"]},{"k":5,"g":"","n":"Alternating arm flossing","r":"","df":80,"ds":0,"m":"Switch — start with the left","ca":"Right arm travelling back","cb":"Left arm travelling back","s":["Same band, same grip — this time one arm at a time.","The right arm goes back as the left reaches up; then the left goes back and the right comes forward.","Keep the shoulder moving back and in external rotation rather than rolling forward.","At the halfway chime start with the left instead, and narrow your hands for more resistance if the shoulders feel warm."],"c":"Shoulders stay in the same line — elevated and externally rotated","e":["Loop band"]},{"k":6,"g":"","n":"One arm up, eyes the other way","r":"10 each side","df":90,"ds":70,"m":"Switch — right arm up, eyes left","ca":"Ribs closed, setting up","cb":"Arm reaching back","s":["Sit tall with the ribs tucked in so you're not arching — the movement is only in the arm.","The left arm goes up and back behind you in external rotation, elbow straightening as it travels.","Since it's the left arm working, turn your eyes sharp right and hold them there, and see if it improves the range.","Ten reps, then switch at the chime: right arm up, eyes sharp left."],"c":"Close the ribs and isolate the movement to the arm","e":["Loop band"]},{"k":7,"g":"","n":"Cow face arms with the band","r":"5 each side","df":90,"ds":65,"m":"Switch — right arm on top","ca":"Top elbow bent","cb":"Straightening, pushing back","s":["Gomukhasana arms: one arm internally rotates and goes behind you, the other externally rotates and comes up and over.","The right hand holds the band low behind and pulls down for resistance; the left elbow comes in close towards your face.","Only the top arm works — bend it and straighten it five times, and let the triceps do the job.","Then push both arms backwards together. At the chime, right arm on top."],"c":"Don't let the top elbow splay out — hug it in towards your ear","e":["Loop band"]},{"k":8,"g":"Eyes and balance","n":"Steady thumb, head side to side","r":"20 seconds","df":25,"ds":25,"m":null,"ca":"Head turned one way","cb":"And the other","s":["Thumb up in front of you, or find a steady point on the wall.","Keep the gaze on it — the eyes don't move, only the head.","Turn the head side to side, and keep the target clear rather than blurred."],"c":"Keep your focus on the thumb — only the head moves","e":[]},{"k":9,"g":"","n":"Steady thumb, head up and down","r":"20 seconds","df":25,"ds":25,"m":null,"ca":"Head lifting","cb":"Head lowering","s":["Same steady gaze on the same target.","Now the head travels up and down instead of turning.","If it feels easy you can increase the speed — but the target has to stay clear."],"c":"Make sure you see the target clearly and not blurred","e":[]},{"k":10,"g":"","n":"Head steady, body turns","r":"20 seconds","df":25,"ds":25,"m":null,"ca":"Turning one way","cb":"Turning the other","s":["Stand up, far enough back that you can see your target easily.","This one reverses it — the head stays completely still and the body moves.","Turn the torso left and right underneath a steady head. You can move your feet too."],"c":"Head steady. The torso is what's moving","e":[]},{"k":11,"g":"","n":"Head steady, body side to side","r":"20 seconds","df":25,"ds":25,"m":null,"ca":"Leaning one way","cb":"And the other","s":["Still standing, still gazing at the same point.","Now move the body from side to side rather than turning it.","Relax your breath and let the head stay where it is."],"c":"This shows your brain that using the neck at different angles is safe","e":[]},{"k":12,"g":"On the floor","n":"Down dog, neck free","r":"","df":60,"ds":0,"m":null,"ca":"Folding forward","cb":"Down dog, hips high","s":["Feet apart at the front of the mat. Inhale, arms reach, gaze up; exhale and fold as you bend the knees.","Inhale to a halfway lift, lengthening the heart forward, then step the legs back to downward facing dog.","Bend the knees, lift the hips up high, open the fingers wide — as wide as the mat if that feels better.","Bend and hug the elbows in, push the hands down and elevate the shoulders, and move the neck side to side and up and down while you're there."],"c":"Not too much effort in the upper traps","e":[]},{"k":13,"g":"","n":"Wide-hand cobra","r":"×5","df":60,"ds":0,"m":null,"ca":"Lowered down","cb":"Lifted, head back","s":["Come into plank and lower all the way to the floor — no chaturangas.","Hands wide, maybe outside the mat, elbows bent, feet as wide as the mat and the toes pointed back.","Lengthen the side body: shoulders move up towards the ears and the belly pulls in.","Shoulders back, shoulder blades together, head back — then lower down slowly. Five lifts."],"c":"Pull the belly up as you lift","e":[]},{"k":14,"g":"","n":"Elbows in, hands lifted","r":"","df":50,"ds":0,"m":null,"ca":"Lifted, elbows squeezing","cb":"Lowering down","s":["Bring the hands closer this time, forearms perpendicular to the ground, and lift the head.","Now lift the hands off the floor and keep squeezing the elbows in, as if a foam roller sat between them.","The hands aren't touching. Push the back of the head backwards.","Squeeze the glutes and engage the core so the lower back doesn't collapse."],"c":"Use your back muscles instead of your arms","e":[]},{"k":15,"g":"","n":"Foam roller between the elbows","r":"hold 5","df":60,"ds":0,"m":null,"ca":"Roller in place","cb":"Squeeze and lift","s":["Lie on your belly and take the foam roller behind you, then bring one hand closer and then the other.","Your hands don't touch the floor — you should feel the roller in between your elbows.","Squeeze it and lift: glutes on, pubic bone pressing down, everything lifting through the back muscles.","Chin parallel to the chest so the back of the neck stays long. Hold it there for five."],"c":"Elbows hug in","e":["Foam roller"]},{"k":16,"g":"","n":"Sliding blanket, child's pose to cobra","r":"","df":110,"ds":0,"m":null,"ca":"Arms slid forward","cb":"Pulling in and pushing up","s":["Blanket in front of the mat with your hands on the sliding surface. Start in child's pose.","Round the back into cat with the tailbone tucked, then find your cobra — toes down or pointed, whichever you prefer.","Lower down very slowly and slide the blanket forward, keeping the elbows straight.","Pull everything in as far as you can. When you can't pull any further, that's the moment to bend the elbows and push up into cobra.","Then round the back and travel back to child's pose."],"c":"Hug your elbows in — don't let them turn out","e":["Blanket"]},{"k":17,"g":"Lunge with the strap","n":"Low lunge, right arm circles","r":"hold 5","df":110,"ds":70,"m":null,"ca":"Half split, reaching forward","cb":"Arm circling behind","s":["From down dog take the right leg up and back, bend the knee and turn the hips open, then step the right foot outside the right hand. Left knee down.","Make a small loop in the strap and hook it around the left foot, holding it with the right hand in external rotation, palm facing up.","Shift the hips back into a half split, right hand reaching towards the right toe, front leg straight.","Then bend the front knee and take the arm behind you — the arm makes a half circle, behind you and around.","On the last round stay there, bend the knee, walk the hand down the strap and push the leg back. Head back, hold for five."],"c":"Leave enough room to use your leg to push the arm","e":["Strap"]},{"k":18,"g":"","n":"Nerve floss, right arm","r":"×5","df":45,"ds":45,"m":null,"ca":"Arm pushing away, head tilted","cb":"Elbow in, head to centre","s":["Come to a seat and take the right arm out to the side, the shoulder pressing down away from your ear.","Tilt the head to the left, away from that arm, and you'll feel the tingling travelling down.","Then bend the right elbow back in, elbow in line with the shoulder, and bring the head back to neutral.","Push away, and in. Five times."],"c":"This is the one for when your neck feels stiff at work","e":[]},{"k":19,"g":"","n":"Low lunge, left arm circles","r":"hold 5","df":110,"ds":70,"m":null,"ca":"Reaching forward","cb":"Arm circling back","s":["Down dog with the left leg lifted. Turn the hips, point the left toes back and let the right leg extend. One more breath there.","Pull the left knee into the chest, round the back and step the left foot outside the left hand.","Hook the strap to the back foot and keep the left arm in external rotation; the right hand can come out to the side.","Reach, shift the hips back towards the left foot, then bend the knee and take the arm behind — three circles, letting the head travel back.","Last round: stay up, take the strap over your shoulder like a backpack so the elbow faces in and up, and push the leg back. Hold for five."],"c":"The angle of the arm changes as it circles","e":["Strap"]},{"k":20,"g":"","n":"Nerve floss, left arm","r":"×5","df":45,"ds":45,"m":null,"ca":"Arm pushing out, head tilted","cb":"Coming back in","s":["The left arm pushes out to the side, shoulder pressing down away from the ear.","The head tilts to the right, away from the working arm.","Feel the tingling in the arm, then come back — elbow in, head to centre.","Push out and back in, five reps."],"c":"Shoulder stays down as the arm pushes out","e":[]},{"k":21,"g":"","n":"Shoulder flossing again","r":"","df":45,"ds":45,"m":null,"ca":"Arms up in front","cb":"Travelling behind","s":["Shake out the shoulders and pick the band back up.","Same as the very first time: pinkies turned in, ribs c var a = (ART[b.k]||["",""]).map(svgOf);
return '<figure>' + a[0] + '<figcaption>' + b.ca + "</figcaption></figure>" +
'<figure>' + a[1] + '<figcaption>' + b.cb + "</figcaption></figure>";
};
var STEP_GAP = 3.6;
var show = function(i){
idx = i;
var b = B[i];
$("title").textContent = b.n;
$("reps").textContent  = b.r || "";
$("kit").innerHTML = (b.e || []).map(function(x){
return '<span class="eq">' + x + "</span>"; }).join("");
$("art").innerHTML     = figs(b);
$("corr").textContent  = b.c;
$("of").textContent    = String(i+1).padStart(2,"0") + " / " + String(B.length).padStart(2,"0");
$("cue").innerHTML = '<ol class="steps">' +
b.s.map(function(x){ return '<li class="later">' + x + "</li>"; }).join("") + "</ol>";
$("enc").className = "";
$("enc").textContent = "";
var sp = $("spine").children;
for (var k = 0; k < sp.length; k++)
sp[k].className = k < i ? "done" : (k === i ? "now" : "");
fired = {}; acc = 0; t0 = performance.now();
paused = false;                       // a block always starts running
$("pause").textContent = "Pause";
$("clock").textContent = fmt(b.d);
$("barI").style.width = "0%";
chimeOne();
say(b.n);
};
var banner = function(t){
$("bannerTxt").textContent = t;
$("banner").className = "on";
setTimeout(function(){ $("banner").className = ""; }, 4200);
};
var body = function(){
var b = B[idx];
var e = acc + (paused ? 0 : (performance.now() - t0) / 1000);
var left = b.d - e;
$("clock").textContent = fmt(left);
$("barI").style.width = Math.min(100, (e / b.d) * 100) + "%";
var lis = $("cue").getElementsByTagName("li");
var live = Math.min(lis.length, Math.floor(e / STEP_GAP) + 1);
for (var k = 0; k < lis.length; k++){
if (k < live - 1)      lis[k].className = "past";
else if (k === live-1) lis[k].className = "";
else                   lis[k].className = "later";
}
for (var m = 0; m < live; m++){
var key = "s" + m;
if (!fired[key]) { fired[key] = 1; if (m > 0) say(b.s[m]); }
}
if (b.m && e >= b.d / 2 && !fired.mid){
fired.mid = 1; chimeTwo(); banner(b.m); say(b.m);
}
[3,2,1].forEach(function(n){
if (left <= n && left > n - 1 && !fired["c" + n]) { fired["c" + n] = 1; tick(); }
});
if (left <= 0){
if (ENC[b.k]) { $("enc").textContent = ENC[b.k]; $("enc").className = "on"; say(ENC[b.k]); }
if (idx + 1 < B.length){
var nx = idx + 1;
setTimeout(function(){ show(nx); }, ENC[b.k] ? 2100 : 250);
paused = true;
} else {
finish();
}
}
};
var loop = function(){
try { if (running && !paused) body(); } catch(err){ /* never stop the clock */ }
if (running) raf = requestAnimationFrame(loop);
};
var finish = function(){
running = false; paused = true; unlock(); fanfare();
$("run").className = ""; $("done").className = "on";
var tot = B.reduce(function(a, b){ return a + b.d; }, 0);
$("doneP").textContent = B.length + " blocks, " + fmt(tot) + ".";
say("That's the session.");
};
var start = function(){
pick();
$("spine").innerHTML = B.map(function(){ return "<i></i>"; }).join("");
$("home").style.display = "none";
$("done").className = "";
$("run").className = "on";
running = true; paused = false;
loadVoice(); lock();
show(0);
if (raf) cancelAnimationFrame(raf);
loop();
};
var goHome = function(){
running = false; paused = true; unlock(); hush();
if (raf) { cancelAnimationFrame(raf); raf = null; }
$("run").className = ""; $("done").className = "";
$("home").style.display = "";
};
$("mFull").onclick  = function(){ setMode("full"); };
$("mShort").onclick = function(){ setMode("short"); };
$("go").onclick     = start;
$("again").onclick  = start;
$("home2").onclick  = goHome;
$("home3").onclick  = goHome;
$("pause").onclick = function(){
if (paused){ t0 = performance.now(); paused = false; $("pause").textContent = "Pause"; }
else { acc += (performance.now() - t0) / 1000; paused = true; $("pause").textContent = "Resume"; hush(); }
};
$("next").onclick = function(){
hush();
if (idx + 1 < B.length){ paused = false; $("pause").textContent = "Pause"; show(idx + 1); }
else finish();
};
$("prev").onclick = function(){
hush();
if (idx > 0){ paused = false; $("pause").textContent = "Pause"; show(idx - 1); }
};
$("sound").onclick = function(){
sound = !sound;
$("sound").textContent = sound ? "Sound on" : "Sound off";
if (!sound) hush();
};
$("art").onclick = function(){
$("lbIn").innerHTML = $("art").innerHTML;
$("lb").className = "on";
};
$("lb").onclick = function(){ $("lb").className = ""; };
document.addEventListener("visibilitychange", function(){ if (!document.hidden) lock(); });
try { if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoice; } catch(e){}
setMode("full");
})();</script></body></html>
