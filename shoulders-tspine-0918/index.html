<style>:root{--ink:#12201B;--surface:#1A2B24;--line:#2B4137;--chalk:#ECEFE7;--muted:#8FA89B;--dim:#5E7669;--signal:#8FCBA5;--calm:#DDBE7E;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--mono:"DejaVu Sans Mono",monospace;}*{box-sizing:border-box;}html,body{margin:0;padding:0;background:var(--ink);color:var(--chalk);font-family:"Poppins","Carlito",sans-serif;}h1,h2,.serif{font-family:var(--serif);}.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}.top h1{font-size:1.5rem;margin:0;color:var(--chalk);}.total{font-family:var(--mono);font-size:1.3rem;color:var(--signal);}.toggles{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;}.pill{background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:.95rem;}.pill.active{background:var(--signal);color:var(--ink);border-color:var(--signal);font-weight:600;}.pill.gym{border-style:dashed;}.gym-note{display:none;background:var(--surface);border-left:3px solid var(--calm);padding:10px 14px;margin:10px 0;font-size:.9rem;color:var(--muted);border-radius:4px;}ul.plan{list-style:none;margin:16px 0;padding:0;border-top:1px solid var(--line);}ul.plan li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.95rem;}ul.plan .dur{font-family:var(--mono);color:var(--dim);width:44px;flex:none;}ul.plan .name{flex:1;}.kit{font-size:.72rem;color:var(--calm);border:1px solid var(--calm);border-radius:10px;padding:1px 8px;}.kit.gym{color:var(--muted);border-color:var(--dim);}.begin{display:block;width:100%;background:var(--signal);color:var(--ink);border:none;padding:16px;border-radius:10px;font-size:1.15rem;font-weight:700;cursor:pointer;margin-top:20px;font-family:var(--serif);}.begin:active{opacity:.85;}#runScreen{display:none;}.progress-track{height:5px;background:var(--surface);border-radius:3px;overflow:hidden;margin-bottom:18px;}.progress-fill{height:100%;background:var(--signal);width:0%;transition:width .3s linear;}.run-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}.gym-badge{display:none;background:var(--calm);color:var(--ink);font-size:.65rem;padding:2px 7px;border-radius:8px;margin-left:8px;vertical-align:middle;}#blockTitle{font-size:1.6rem;margin:0;}#blockTimer{font-family:var(--mono);font-size:2.2rem;color:var(--signal);}.equip-tags{color:var(--calm);font-size:.85rem;margin-bottom:10px;min-height:1em;}ul.steps{list-style:none;padding:0;margin:14px 0;}ul.steps li{padding:8px 0;font-size:1.05rem;color:var(--dim);border-bottom:1px solid var(--line);}ul.steps li.current{color:var(--chalk);font-weight:600;}ul.steps li.dim{opacity:.55;}.correction{font-style:italic;color:var(--calm);font-size:.95rem;margin:14px 0;padding:10px 14px;background:var(--surface);border-radius:6px;border-left:3px solid var(--calm);}.media-wrap{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;}.media-wrap figure{flex:1;min-width:130px;margin:0;background:var(--surface);border-radius:8px;padding:8px;text-align:center;cursor:zoom-in;}.media-wrap figure svg{width:100%;height:auto;display:block;}.media-wrap figure img{width:100%;height:auto;display:block;border-radius:4px;}.media-wrap figure figcaption{font-size:.8rem;color:var(--muted);margin-top:6px;}.media-wrap figure.enlarged{position:fixed;inset:5%;z-index:50;flex:none;width:90%;display:flex;flex-direction:column;justify-content:center;}.encourage{position:fixed;left:16px;right:16px;bottom:-80px;background:var(--calm);color:var(--ink);padding:12px 16px;border-radius:8px;font-weight:600;transition:bottom .4s ease;max-width:608px;margin:0 auto;}.encourage.show{bottom:20px;}.pause{margin-top:14px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:10px 20px;border-radius:8px;cursor:pointer;}footer.credit{margin-top:30px;font-size:.75rem;color:var(--dim);text-align:center;}ul.plan .th{width:40px;height:40px;flex:0 0 40px;border-radius:7px;overflow:hidden;background:#16261F;border:1px solid #22362D;display:flex;align-items:center;justify-content:center;align-self:center}ul.plan .th img{width:100%;height:100%;object-fit:cover;display:block}ul.plan .th svg{display:block;width:150%;max-width:none;height:auto;border-radius:0}ul.plan .th.none::after{content:"";width:12px;height:1.5px;background:#3E5A4B;border-radius:1px}</style>

<div class="wrap">
  <div id="homeScreen">
    <div class="top"><h1>Shoulders &amp; T-Spine — Sep 18</h1><div class="total" id="totalTimer">0:00</div></div>
    <div class="toggles">

    <button class="begin" id="beginBtn">Begin</button>
  </div>

    <button class="pause" id="pauseBtn">Pause</button>
    <div class="total" style="margin-top:14px;font-size:1rem;">Total remaining: <span id="totalTimerRun"></span></div>
  </div>

  <div class="encourage" id="encourageBanner"></div>

</div>

function q(id){ return document.getElementById(id); }
function cacheEls(){
el.begin = q('beginBtn');
el.pause = q('pauseBtn');
el.modeFull = q('modeFull');
el.modeShort = q('modeShort');
el.gymToggle = q('gymToggle');
el.gymNote = q('gymNote');
el.blockTitle = q('blockTitle');
el.blockTimer = q('blockTimer');
el.totalTimer = q('totalTimer');
el.totalTimerRun = q('totalTimerRun');
el.stepsList = q('stepsList');
el.correction = q('correctionLine');
el.mediaWrap = q('mediaWrap');
el.equipTags = q('equipTags');
el.progressFill = q('progressFill');
el.planList = q('planList');
el.runScreen = q('runScreen');
el.homeScreen = q('homeScreen');
el.encourage = q('encourageBanner');
el.gymBadge = q('gymBadge');
}
function renderHome(){
el.totalTimer.textContent = fmt(totalDuration());
var blocks = activeBlocks();
el.planList.innerHTML = blocks.map(function(b){
var tags = b.equip.length ? ' <span class="kit">'+b.equip.join(' Â· ')+'</span>' : '';
var gymTag = b.gymOnly ? ' <span class="kit gym">gym</span>' : '';
var th = (b.media && b.media.length) ? '<span class="th">'+b.media[0].html+'</span>' : '<span class="th none"></span>';
return '<li><span class="dur">'+fmt(blockDuration(b))+'</span>'+th+'<span class="name">'+b.title+'</span>'+tags+gymTag+'</li>';
}).join('');
}
function setMode(mode){
state.mode = mode;
el.modeFull.classList.toggle('active', mode==='full');
el.modeShort.classList.toggle('active', mode==='short');
renderHome();
}
function setGym(on){
state.gym = on;
el.gymToggle.classList.toggle('active', on);
el.gymNote.style.display = on ? 'block' : 'none';
renderHome();
}
function begin(){
state.running = true;
state.paused = false;
state.blockIndex = 0;
state.pauseAccum = 0;
el.homeScreen.style.display = 'none';
el.runScreen.style.display = 'block';
requestWakeLock();
startBlock();
loop();
}
function startBlock(){
var blocks = activeBlocks();
var b = blocks[state.blockIndex];
if (!b){ finishSession(); return; }
state.blockStartPerf = performance.now();
clearStepTimers();
el.blockTitle.textContent = b.title;
el.correction.textContent = b.correction || '';
el.correction.style.display = b.correction ? 'block' : 'none';
el.equipTags.textContent = b.equip.length ? b.equip.join(' + ') : '';
el.gymBadge.style.display = b.gymOnly ? 'inline' : 'none';
renderMedia(b);
scheduleSteps(b);
chimeSingle();
speak(b.title);
state.encouragementsFired = [];
}
function clearStepTimers(){
state.stepTimers.forEach(function(t){ clearTimeout(t); });
state.stepTimers = [];
el.stepsList.innerHTML = '';
}
function scheduleSteps(b){
var lines = b.lines;
var stepEls = lines.map(function(line, i){
var li = document.createElement('li');
li.textContent = line;
li.className = 'step pending';
el.stepsList.appendChild(li);
return li;
});
var dur = blockDuration(b);
var mid = dur * 500; // ms to true halfway point
lines.forEach(function(line, i){
var t = setTimeout(function(){
stepEls.forEach(function(s,j){ s.classList.toggle('current', j===i); s.classList.toggle('dim', j!==i); });
speak(line);
}, i * STEP_GAP);
state.stepTimers.push(t);
});
// mid-block cue: double chime at the TRUE halfway point of the block
var midTimer = setTimeout(function(){ chimeDouble(); }, mid);
state.stepTimers.push(midTimer);
}
function renderMedia(b){
el.mediaWrap.innerHTML = '';
(b.media || []).forEach(function(item){
var fig = document.createElement('figure');
fig.innerHTML = item.html;
var cap = document.createElement('figcaption');
cap.textContent = item.caption;
fig.appendChild(cap);
fig.onclick = function(){ fig.classList.toggle('enlarged'); };
el.mediaWrap.appendChild(fig);
});
}
function loop(){
if (!state.running) return;
try{
var blocks = activeBlocks();
var b = blocks[state.blockIndex];
if (b){
var dur = blockDuration(b);
var elapsedMs = performance.now() - state.blockStartPerf;
var remaining = dur - elapsedMs/1000;
el.blockTimer.textContent = fmt(remaining);
var elapsedTotal = blocks.slice(0,state.blockIndex).reduce(function(s,x){return s+blockDuration(x);},0) + Math.min(dur, elapsedMs/1000);
var remainTotal = fmt(totalDuration() - elapsedTotal);
el.totalTimer.textContent = remainTotal;
if (el.totalTimerRun) el.totalTimerRun.textContent = remainTotal;
el.progressFill.style.width = Math.min(100, 100*elapsedTotal/totalDuration()) + '%';
if (remaining <= 3.05 && remaining > 2.95) ticks321();
maybeEncourage(elapsedTotal);
if (elapsedMs/1000 >= dur){
state.blockIndex += 1;
if (state.blockIndex >= blocks.length){ finishSession(); return; }
startBlock();
}
} else {
finishSession(); return;
}
} finally {
state.rafId = requestAnimationFrame(loop);
}
}
var ENCOURAGE_POINTS = [0.3, 0.6, 0.85];
var ENCOURAGE_LINES = [
"Good — that's the hardest part of starting done.",
"Your T-spine is opening up more than last time.",
"Almost through — finish it out."
];
function maybeEncourage(elapsedTotal){
var frac = elapsedTotal / totalDuration();
ENCOURAGE_POINTS.forEach(function(p, i){
if (frac >= p && state.encouragementsFired.indexOf(i) === -1){
state.encouragementsFired.push(i);
showEncourage(ENCOURAGE_LINES[i]);
}
});
}
function showEncourage(text){
el.encourage.textContent = text;
el.encourage.classList.add('show');
setTimeout(function(){ el.encourage.classList.remove('show'); }, 4000);
}
function finishSession(){
state.running = false;
if (state.rafId) cancelAnimationFrame(state.rafId);
clearStepTimers();
chimeEnd();
el.blockTitle.textContent = "Session complete";
el.blockTimer.textContent = "0:00";
el.correction.style.display = 'none';
releaseWakeLock();
}
function togglePause(){
state.paused = !state.paused;
el.pause.textContent = state.paused ? 'Resume' : 'Pause';
if (state.paused){
if (state.rafId) cancelAnimationFrame(state.rafId);
clearStepTimers();
} else {
// resume: shift blockStartPerf forward by nothing extra (simplify: restart current block's remaining time)
loop();
}
}
function init(){
cacheEls();
renderHome();
el.modeFull.onclick = function(){ setMode('full'); };
el.modeShort.onclick = function(){ setMode('short'); };
el.gymToggle.onclick = function(){ setGym(!state.gym); };
el.begin.onclick = begin;
if (el.pause) el.pause.onclick = togglePause;
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = function(){ voiceCache = null; };
}
if (document.readyState === 'loading'){
document.addEventListener('DOMContentLoaded', init);
} else {
init();
}
window.__mobilityApp = { begin: begin, setMode: setMode, setGym: setGym, state: state, activeBlocks: activeBlocks, totalDuration: totalDuration };
})();</script>
</body>
