the band. Back of the head down."], "c": "If the knees fade out, squeeze the imaginary block", "e": ["Band"]}, {"k": 22, "g": "Band, kneeling", "n": "Band shoulder prep", "r": "", "df": 80, "ds": 70, "m": null, "ca": "Arms up, palms forward", "cb": "Circling back", "s": ["Kneeling or seated, band held wide, palms facing forward, wrists straight.", "Arms up, shoulders lift, then draw them back \u2014 small pulses.", "Full circles, head in line with the shoulders.", "Band behind your back: bend the elbows and pull them down, tips of the shoulder blades together \u2014 then straighten."], "c": "Wrists straight \u2014 the movement comes from the shoulder", "e": ["Band"]}, {"k": 23, "g": "", "n": "Band overhead cat and cow", "r": "breath-paced", "df": 80, "ds": 70, "m": null, "ca": "Band under the feet", "cb": "Arms up, chest open", "s": ["Kneeling, band under the tops of the feet behind you, held on the thumb and index-finger side.", "Arms up and over, band elevated high.", "Inhale, cow: push the shoulders behind you and open the chest.", "Exhale, cat: ribs in, round."], "c": "Open the chest, not the arms \u2014 they don't go sideways", "e": ["Band"]}, {"k": 24, "g": "On the wheel", "n": "Wheel backbend, head held", "r": "", "df": 75, "ds": 60, "m": null, "ca": "Hands holding the head", "cb": "Hips lifting", "s": ["Hair up. Wheel behind your back, hands holding the back of the head, elbows close where you can see them.", "Slight chin tuck and glide back \u2014 the back of the head stays neutral, the chin doesn't open.", "The feet lift the hips and you lean back over the wheel.", "Tuck and tip the pelvis, a few rounds."], "c": "Slight tuck, glide \u2014 don't compress the back of the neck", "e": ["Wheel"]}, {"k": 25, "g": "", "n": "Wheel backbend, grab the wheel", "r": "", "df": 75, "ds": 60, "m": null, "ca": "Holding the wheel", "cb": "Elbows down", "s": ["Reach back, grab the wheel and pull it towards you.", "Let the head go \u2014 the neck relaxed on the wheel.", "Lower the hips to the floor as if you want to sit down.", "Elbows down to the floor and up \u2014 elbows in."], "c": "Once you're holding the wheel, let the head go", "e": ["Wheel"]}, {"k": 26, "g": "", "n": "Thigh roll on the wheel", "r": "both sides", "df": 75, "ds": 0, "m": "Switch legs", "ca": "Thigh on the wheel", "cb": "Hand to the back foot", "s": ["Hands on the floor, the front of the right thigh on the wheel, left leg forward.", "Roll back and forth \u2014 on the thigh bone, not the knee.", "A tender spot? Bend the knee and roll a few inches up and down, rotating the thigh.", "Optional: the left hand reaches back to the right foot. Switch legs at the halfway chime."], "c": "Keep your head lifted", "e": ["Wheel"]}, {"k": 27, "g": "", "n": "Wheel tuck", "r": "both sides", "df": 60, "ds": 0, "m": "Switch feet", "ca": "Ankle on the wheel", "cb": "Pulling in", "s": ["Hands down as if coming into down dog, the top of the right ankle on the wheel, left foot on top.", "Squeeze everything towards the midline so the wheel doesn't go sideways.", "Gaze forward first and find your balance, then pull the wheel in and push back.", "Hips don't drop. Switch feet at the halfway chime."], "c": "Look forward, not down", "e": ["Wheel"]}, {"k": 28, "g": "Closing", "n": "Neck nerve flossing", "r": "both sides", "df": 120, "ds": 100, "m": "Other side", "ca": "Arms out, rotating in \u00b7 you", "cb": "Head tilted, gliding \u00b7 you", "s": ["Arms out to the sides and rotate them inward; bend the elbows, hands behind the back. Shoulder blades down and back, elbows a little forward.", "Chin glide back. Tilt the head to one side, then turn the chin down towards that shoulder.", "From there, glide the head forward and back a few times \u2014 and move the jaw side to side.", "At the halfway chime, the other side."], "c": "Move the jaw while you glide \u2014 there's a big nerve right there", "e": []}, {"k": 29, "g": "", "n": "Lying shoulder stretch", "r": "both sides", "df": 120, "ds": 100, "m": "Switch \u2014 left arm out", "ca": "Arm out, rolling over", "cb": "Knee behind, arm opening \u00b7 you", "s": ["Face down on your stomach, right arm out to the side in line with the shoulder.", "Bend the left knee and roll to your right side.", "The left knee comes behind the right knee, thigh rolled inward so the knee faces down.", "Move the right arm further right \u2014 towards the wall, not the ceiling. Try the knee up and down and stay where you feel more."], "c": "Knee in, behind the other knee \u2014 the arm opens more easily", "e": []}, {"k": 30, "g": "", "n": "Chest opener into side lift", "r": "both sides", "df": 80, "ds": 80, "m": "Switch sides", "ca": "Hand forward, shoulder lifting", "cb": "Hips up, heart forward", "s": ["Sitting on your right side, right hand on the floor a little further forward than the shoulder, left foot on the ground.", "Lengthen the side body: lift the shoulder, roll it back, draw it down \u2014 the chest moves forward.", "Left hand behind the head, and push the head back into the hand.", "Lift the hips onto the outer edge of the right foot and keep breathing. Switch sides at the halfway chime."], "c": "Head back, heart forward", "e": []}];;

var actx = null;
var ac = function(){
if (!sound) return null;
try { if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
if (actx.state !== "running" && actx.resume) actx.resume();
return actx; } catch(e){ return null; }
};
var tone = function(f, when, dur, vol){
var a = ac(); if (!a) return;
try {
var o = a.createOscillator(), g = a.createGain();
o.type = "sine"; o.frequency.value = f;
g.gain.setValueAtTime(0.0001, a.currentTime + when);
g.gain.exponentialRampToValueAtTime(vol||0.16, a.currentTime + when + 0.015);
g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + when + dur);
o.connect(g); g.connect(a.destination);
o.start(a.currentTime + when); o.stop(a.currentTime + when + dur + 0.05);
} catch(e){}
};

try {

var want = ["Ava","Nicky","Samantha","Zoe","Karen","Serena","Google UK English Female","Google US English","Daniel","Alex"];
for (var i = 0; i < want.length; i++){
for (var j = 0; j < vs.length; j++){ if (vs[j].name === want[i]) { voice = vs[j]; return; } }
