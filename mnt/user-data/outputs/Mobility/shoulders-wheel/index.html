var ALL = [{"k":1,"g":"Seated","n":"Cactus arm cat and cow","r":"","df":90,"ds":70,"m":null,"ca":"Round — elbows together","cb":"Open — chest up, head back","s":["Come to a comfortable seat and take the arms out into cactus — back straight, ribs in.","Round as you push the elbows together and forward, letting the shoulder blades glide apart at the back.","Then inhale and open: lift the chest like you're going into a backbend, and remember to move the head back too.","Let the pelvis come forward as you open, and travel back as you round."],"c":"Move between cat and cow with the cactus arms","e":[]},{"k":2,"g":"","n":"Side bend, elbow in and reach","r":"5 each side","df":90,"ds":65,"m":"Switch sides — left arm up","ca":"Elbow in, shoulder blade down","cb":"Reaching up and over","s":["Right arm up first — that is the working arm. The left arm stays down and heavy.","First pull the elbow in and bring the tip of the shoulder blade down.","Then reach up and over as the elbow opens out — reaching, reaching, reaching — and come back to centre.","Five each side. At the halfway chime, switch: right hand pushes down to ground the left femur bone, left arm reaches up."],"c":"Pull the elbow in and close the side ribs","e":[]},{"k":3,"g":"","n":"Eagle arms, round and open","r":"3 rounds each side","df":80,"ds":0,"m":"Switch — left elbow underneath","ca":"Elbows crossed, back round","cb":"Arms lifting, gaze up","s":["Right elbow underneath first: the right arm goes under and the left crosses over the top of it.","Push the elbows against each other, round your back and push them forward. Palms together if you like, but it isn't necessary.","Inhale, lift the arms up into a backbend and take the gaze to the ceiling; exhale, elbows in and round.","Three rounds, then switch at the chime so the left elbow is underneath."],"c":"When the elbows come in, the shoulder blades push apart","e":[]},{"k":4,"g":"With the band","n":"Shoulder flossing, both arms","r":"","df":60,"ds":60,"m":null,"ca":"Arms up in front","cb":"Travelling behind","s":["Hold the band with the pinkies turned towards one another, and a light resistance already in it.","Inhale, reach the arms up, then take them behind you.","Keep the ribs closed so the back stays straight — the motion comes only from the shoulders, not from a backbend.","Elevate the shoulders and keep pushing the elbows into a straight position."],"c":"The shoulder shouldn't come forward to bring the band back","e":["Loop band"]},{"k":5,"g":"","n":"Alternating arm flossing","r":"","df":80,"ds":0,"m":"Switch — start with the left","ca":"Right arm travelling back","cb":"Left arm travelling back","s":["Same band, same grip, but one arm at a time — the right arm leads, going back first.","The right arm goes back as the left reaches up; then the left goes back and the right comes forward.","Keep the shoulder moving back and in external rotation rather than rolling forward.","At the halfway chime start with the left instead, and narrow your hands for more resistance if the shoulders feel warm."],"c":"Shoulders stay in the same line — elevated and externally rotated","e":["Loop band"]},{"k":6,"g":"","n":"One arm up, eyes the other way","r":"10 each side","df":90,"ds":70,"m":"Switch — right arm up, eyes left","ca":"Ribs closed, setting up","cb":"Arm reaching back","s":["Sit tall with the ribs tucked in so you're not arching — the movement is only in the arm.","The left arm is the one working: up and back behind you in external rotation, elbow straightening as it travels. The right arm stays back and still.","Since it's the left arm working, turn your eyes sharp right and hold them there, and see if it improves the range.","Ten reps, then switch at the chime: right arm up, eyes sharp left."],"c":"Close the ribs and isolate the movement to the arm","e":["Loop band"]},{"k":7,"g":"","n":"Cow face arms with the band","r":"5 each side","df":90,"ds":65,"m":"Switch — right arm on top","ca":"Top elbow bent","cb":"Straightening, pushing back","s":["Left arm on top — that is the arm that does the work. The right one only anchors.","The left arm externally rotates and comes up and over, elbow hugging in towards your ear, hand dropping down your back.","The right arm internally rotates and goes low behind your back. It only holds the band and pulls down for resistance — it does not move.","Now bend and straighten the left elbow five times and let the triceps do the job. The right hand stays exactly where it is.","Then push both arms backwards together. At the chime, swap: right arm on top and working, left arm anchoring."],"c":"Don't let the top elbow splay out — hug it in towards your ear","e":["Loop band"]},{"k":8,"g":"Eyes and balance","n":"Steady thumb, head side to side","r":"20 seconds","df":25,"ds":25,"m":null,"ca":"Head turned one way","cb":"And the other","s":["Thumb up in front of you, or find a steady point on the wall.","Keep the gaze on it — the eyes don't move, only the head.","Turn the head side to side, and keep the target clear rather than blurred."],"c":"Keep your focus on the thumb — only the head moves","e":[]},{"k":9,"g":"","n":"Steady thumb, head up and down","r":"20 seconds","df":25,"ds":25,"m":null,"ca":"Head lifting","cb":"Head lowering","s":["Same steady gaze on the same target.","Now the head travels up and down instead of turning.","If it feels easy you can increase the speed — but the target has to stay clear."],"c":"Make sure you see the target clearly and not blurred","e":[]},{"k":10,"g":"","n":"Head steady, body turns","r":"20 seconds","df":25,"ds":25,"m":null,"ca":"Turning one way","cb":"Turning the other","s":["Stand up, far enough back that you can see your target easily.","This one reverses it — the head stays completely still and the body moves.","Turn the torso left and right underneath a steady head. You can move your feet too."],"c":"Head steady. The torso is what's moving","e":[]},{"k":11,"g":"","n":"Head steady, body side to side","r":"20 seconds","df":25,"ds":25,"m":null,"ca":"Leaning one way","cb":"And the other","s":["Still standing, still gazing at the same point.","Now move the body from side to side rather than turning it.","Relax your breath and let the head stay where it is."],"c":"This shows your brain that using the neck at different angles is safe","e":[]},{"k":12,"g":"On the floor","n":"Down dog, neck free","r":"","df":60,"ds":0,"m":null,"ca":"Folding forward","cb":"Down dog, hips high","s":["Feet apart at the front of the mat. Inhale, arms reach, gaze up; exhale and fold as you bend the knees.","Inhale to a halfway lift, lengthening the heart forward, then step the legs back to downward facing dog.","Bend the knees, lift the hips up high, open the fingers wide — as wide as the mat if that feels better.","Bend and hug the elbows in, push the hands down and elevate the shoulders, and move the neck side to side and up and down while you're there."],"c":"Not too much effort in the upper traps","e":[]},{"k":13,"g":"","n":"Wide-hand cobra","r":"×5","df":60,"ds":0,"m":null,"ca":"Lowered down","cb":"Lifted, head back","s":["Come into plank and lower all the way to the floor — no chaturangas.","Hands wide, maybe outside the mat, elbows bent, feet as wide as the mat and the toes pointed back.","Lengthen the side body: shoulders move up towards the ears and the belly pulls in.","Shoulders back, shoulder blades together, head back — then lower down slowly. Five lifts."],"c":"Pull the belly up as you lift","e":[]},{"k":14,"g":"","n":"Elbows in, hands lifted","r":"","df":50,"ds":0,"m":null,"ca":"Lifted, elbows squeezing","cb":"Lowering down","s":["Bring the hands closer this time, forearms perpendicular to the ground, and lift the head.","Now lift the hands off the floor and keep squeezing the elbows in, as if a foam roller sat between them.","The hands aren't touching. Push the back of the head backwards.","Squeeze the glutes and engage the core so the lower back doesn't collapse."],"c":"Use your back muscles instead of your arms","e":[]},{"k":15,"g":"","n":"Foam roller between the elbows","r":"hold 5","df":60,"ds":0,"m":null,"ca":"Roller in place","cb":"Squeeze and lift","s":["Lie on your belly and take the foam roller behind you, then bring one hand closer and then the other.","Your hands don't touch the floor — you should feel the roller in between your elbows.","Squeeze it and lift: glutes on, pubic bone pressing down, everything lifting through the back muscles.","Chin parallel to the chest so the back of the neck stays long. Hold it there for five."],"c":"Elbows hug in","e":["Foam roller"]},{"k":16,"g":"","n":"Sliding blanket, child's pose to cobra","r":"","df":110,"ds":0,"m":null,"ca":"Arms slid forward","cb":"Pulling in and pushing up","s":["Blanket in front of the mat with your hands on the sliding surface. Start in child's pose.","Round the back into cat with the tailbone tucked, then find your cobra — toes down or pointed, whichever you prefer.","Lower down very slowly and slide the blanket forward, keeping the elbows straight.","Pull everything in as far as you can. When you can't pull any further, that's the moment to bend the elbows and push up into cobra.","Then round the back and travel back to child's pose."],"c":"Hug your elbows in — don't let them turn out","e":["Blanket"]},{"k":17,"g":"Lunge with the strap","n":"Low lunge, right arm circles","r":"hold 5","df":110,"ds":70,"m":null,"ca":"Half split, reaching forward","cb":"Arm circling behind","s":["From down dog take the right leg up and back, bend the knee and turn the hips open, then step the right foot outside the right hand. Left knee down.","Make a small loop in the strap and hook it around the left foot, holding it with the right hand in external rotation, palm facing up.","Shift the hips back into a half split, right hand reaching towards the right toe, front leg straight.","Then bend the front knee and take the arm behind you — the arm makes a half circle, behind you and around.","On the last round stay there, bend the knee, walk the hand down the strap and push the leg back. Head back, hold for five."],"c":"Leave enough room to use your leg to push the arm","e":["Strap"]},{"k":18,"g":"","n":"Nerve floss, right arm","r":"×5","df":45,"ds":45,"m":null,"ca":"Arm pushing away, head tilted","cb":"Elbow in, head to centre","s":["Come to a seat and take the right arm out to the side, the shoulder pressing down away from your ear.","Tilt the head to the left, away from that arm, and you'll feel the tingling travelling down.","Then bend the right elbow back in, elbow in line with the shoulder, and bring the head back to neutral.","Push away, and in. Five times."],"c":"This is the one for when your neck feels stiff at work","e":[]},{"k":19,"g":"","n":"Low lunge, left arm circles","r":"hold 5","df":110,"ds":70,"m":null,"ca":"Reaching forward","cb":"Arm circling back","s":["Down dog with the left leg lifted. Turn the hips, point the left toes back and let the right leg extend. One more breath there.","Pull the left knee into the chest, round the back and step the left foot outside the left hand.","Hook the strap to the back foot and keep the left arm in external rotation; the right hand can come out to the side.","Reach, shift the hips back towards the left foot, then bend the knee and take the arm behind — three circles, letting the head travel back.","Last round: stay up, take the strap over your shoulder like a backpack so the elbow faces in and up, and push the leg back. Hold for five."],"c":"The angle of the arm changes as it circles","e":["Strap"]},{"k":20,"g":"","n":"Nerve floss, left arm","r":"×5","df":45,"ds":45,"m":null,"ca":"Arm pushing out, head tilted","cb":"Coming back in","s":["The left arm pushes out to the side, shoulder pressing down away from the ear.","The head tilts to the right, away from the working arm.","Feel the tingling in the arm, then come back — elbow in, head to centre.","Push out and back in, five reps."],"c":"Shoulder stays down as the arm pushes out","e":[]},{"k":21,"g":"","n":"Shoulder flossing again","r":"","df":45,"ds":45,"m":null,"ca":"Arms up in front","cb":"Travelling behind","s":["Shake out the shoulders and pick the band back up.","Same as the very first time: pinkies turned in, ribs closed, arms up and then behind you.","Add the extension as well, and notice what's changed."],"c":"Do you feel more range of motion?","e":["Loop band"]},{"k":22,"g":"On the wheel","n":"Wheel and band, hips up and down","r":"×10","df":110,"ds":80,"m":null,"ca":"Hips lowering, arms pushing","cb":"Hips lifted","s":["Thread the loop inside the wheel and take both edges over to the side, so the band is equal on both ends.","Lie back over the wheel — head and shoulder blades both supported — elbows in, head back. Mind your hair.","Lift the hips like a hip thrust, then extend the arms fully out against the band.","Keep the hands travelling down towards the floor as you lower the bum down. You don't have to go all the way.","Hips up, tuck the tailbone, and go again. Ten reps."],"c":"The elbows want to come up — keep them in","e":["Wheel","Loop band"]},{"k":23,"g":"","n":"Elbows bent on the wheel","r":"","df":50,"ds":0,"m":null,"ca":"Draped back, elbows bent","cb":"Coming up","s":["Let go of the strap and hold the sides of the wheel instead.","Bend the elbows and bring them down, the way you would in Dwi Pada.","Lengthen the side body first so there's space in the lumbar spine before you go back."],"c":"The backbend lives mostly in the upper thoracic spine","e":["Wheel"]},{"k":24,"g":"Closing","n":"Supine twist, arm overhead","r":"3 each side","df":100,"ds":70,"m":"Switch sides","ca":"Arm reaching forward","cb":"Up and over the ear","s":["On your back with the knees over to one side — hips, knees and ankles all in one line, head supported.","The top arm reaches forward first, then up and over your ear, and then back to the front.","Three reps, slowly, and let the head turn with the arm.","At the halfway chime, switch sides."],"c":"Take the arm over towards the couch, then turn back","e":[]},{"k":25,"g":"","n":"Breathe into the top ribs","r":"","df":45,"ds":45,"m":null,"ca":"Hand resting on hand","cb":"Expanding the top side","s":["Stay in the twist and rest the top hand on the one underneath.","Breathe towards the top ribcage and expand that area.","Keep inhaling, keep inhaling, hold it at the top, and release.","Then try the arm one more time and see how much further it travels."],"c":"Breathe and expand into the top side — more, more, more","e":[]},{"k":26,"g":"","n":"Head turning with the breath","r":"","df":70,"ds":0,"m":null,"ca":"Arms wide, head centre","cb":"Turning with the breath","s":["Legs up on the couch, back on the floor, arms open wide.","Push the back of your head down into the floor and let the shoulders relax.","Reach out towards the sides to glide the shoulder blades apart.","Turn the head slowly from one side to the other, one turn for each breath, and let it get smaller as you go."],"c":"Let each movement last as long as your breath","e":["Couch"]},{"k":27,"g":"","n":"Blocks under the shoulders","r":"","df":50,"ds":0,"m":null,"ca":"Setting the blocks","cb":"Lying back, arms open","s":["One block flat, and the second one set on its tip so it inclines.","The block goes between your shoulder blades, shoulders on the incline, and the head rests back onto the other one.","Open the arms out to the sides, knees bent, feet flat on the floor, knees together.","If that crowds the shoulders, use the supported fish version instead — one block between the shoulder blades, the other behind the head."],"c":"If your neck feels stuck, leave this one out","e":["2 blocks"]}];
