var ENC  = {};

var fmt = function(s){ s = Math.max(0, Math.round(s));
return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
var strip = function(t){ return String(t).replace(/<[^>]+>/g,""); };
var mode = "full", B = [], idx = 0, running = false, paused = true,
t0 = 0, acc = 0, fired = {}, raf = null, sound = true, wake = null;

B = ALL.filter(function(b){ return mode === "full" ? true : b.ds > 0; });

c.d = mode === "full" ? b.df : b.ds;

});

var actx = null;
var ac = function(){
if (!sound) return null;
try { if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
if (actx.state === "suspended") actx.resume();
return actx; } catch(e){ return null; }
};
var tone = function(f, when, dur, vol){
var a = ac(); if (!a) return;
try {
var o = a.createOscillator(), g = a.createGain();
o.type = "sine"; o.frequency.value = f;
g.gain.setValueAtTime(0.0001, a.currentTime + when);
g.gain.exponentialRampToValueAtTime(vol||0.16, a.currentTime + when + 0.015);
g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + when + dur);
o.connect(g); g.connect(a.destination);
o.start(a.currentTime + when); o.stop(a.currentTime + when + dur + 0.05);
} catch(e){}
};
var chimeOne  = function(){ tone(660, 0, 0.55); };
var chimeTwo  = function(){ tone(600, 0, 0.4); tone(760, 0.17, 0.45); };
var tick      = function(){ tone(430, 0, 0.11, 0.09); };
var fanfare   = function(){ [523,659,784,1046].forEach(function(f,i){ tone(f, i*0.13, 0.5); }); };
var voice = null, vq = [], vbusy = false;
var loadVoice = function(){
try {
var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
if (!vs || !vs.length) return;
var want = ["Samantha","Karen","Serena","Google UK English Female","Google US English","Daniel","Alex"];
for (var i = 0; i < want.length; i++){
for (var j = 0; j < vs.length; j++){ if (vs[j].name === want[i]) { voice = vs[j]; return; } }
}
for (var k = 0; k < vs.length; k++){ if (/^en/i.test(vs[k].lang)) { voice = vs[k]; return; } }
} catch(e){}
};
var vnext = function(){
if (vbusy || !vq.length) return;
var txt = vq.shift();
try {
var u = new SpeechSynthesisUtterance(txt);
if (voice) u.voice = voice;
u.rate = 0.97; u.pitch = 1.0;
vbusy = true;
u.onend = u.onerror = function(){ vbusy = false; vnext(); };
speechSynthesis.speak(u);
} catch(e){ vbusy = false; }
};
var say = function(t){
if (!sound || !window.speechSynthesis) return;
vq.push(strip(t)); vnext();
};
var hush = function(){ vq = []; vbusy = false;
try { speechSynthesis.cancel(); } catch(e){} };
var lock = function(){
try { if (navigator.wakeLock && navigator.wakeLock.request)
navigator.wakeLock.request("screen").then(function(w){ wake = w; }, function(){}); } catch(e){}
};
var unlock = function(){ try { if (wake && wake.release) { wake.release(); wake = null; } } catch(e){} };

$("barI").style.width = "0%";
chimeOne();
say(b.n);
};
var banner = function(t){
$("bannerTxt").textContent = t;
$("banner").className = "on";
setTimeout(function(){ $("banner").className = ""; }, 4200);
};
var body = function(){
var b = B[idx];
var e = acc + (paused ? 0 : (performance.now() - t0) / 1000);
var left = b.d - e;
$("clock").textContent = fmt(left);
$("barI").style.width = Math.min(100, (e / b.d) * 100) + "%";
var lis = $("cue").getElementsByTagName("li");
var live = Math.min(lis.length, Math.floor(e / STEP_GAP) + 1);
for (var k = 0; k < lis.length; k++){
if (k < live - 1)      lis[k].className = "past";   // done, still readable
else if (k === live-1) lis[k].className = "now";    // lit white
else                   lis[k].className = "";       // upcoming, still readable
}
for (var m = 0; m < live; m++){
var key = "s" + m;
if (!fired[key]) { fired[key] = 1; if (m > 0) say(b.s[m]); }
}
if (b.m && e >= b.d / 2 && !fired.mid){
fired.mid = 1; chimeTwo(); banner(b.m); say(b.m);
}
[3,2,1].forEach(function(n){
if (left <= n && left > n - 1 && !fired["c" + n]) { fired["c" + n] = 1; tick(); }
});
if (left <= 0){
if (ENC[b.k]) { $("enc").textContent = ENC[b.k]; $("enc").className = "on"; say(ENC[b.k]); }
if (idx + 1 < B.length){
var nx = idx + 1;
setTimeout(function(){ show(nx); }, ENC[b.k] ? 2100 : 250);
paused = true;
} else {
finish();
}
}
};
var loop = function(){
try { if (running && !paused) body(); } catch(err){ /* never stop the clock */ }
if (running) raf = requestAnimationFrame(loop);
};
var finish = function(){
running = false; paused = true; unlock(); fanfare();
$("run").className = ""; $("done").className = "on";
var tot = B.reduce(function(a, b){ return a + b.d; }, 0);
$("doneP").textContent = B.length + " blocks, " + fmt(tot) + ".";
say("That's the session.");
};
var start = function(){
pick();
$("spine").innerHTML = B.map(function(){ return "<i></i>"; }).join("");
$("home").style.display = "none";
$("done").className = "";
$("run").className = "on";
running = true; paused = false;
loadVoice(); lock();
show(0);
if (raf) cancelAnimationFrame(raf);
loop();
};
var goHome = function(){
running = false; paused = true; unlock(); hush();
if (raf) { cancelAnimationFrame(raf); raf = null; }
$("run").className = ""; $("done").className = "";
$("home").style.display = "";
};
$("mFull").onclick  = function(){ setMode("full"); };
$("mShort").onclick = function(){ setMode("short"); };
$("go").onclick     = start;
$("again").onclick  = start;
$("home2").onclick  = goHome;
$("home3").onclick  = goHome;
$("pause").onclick = function(){
if (paused){ t0 = performance.now(); paused = false; $("pause").textContent = "Pause"; }
else { acc += (performance.now() - t0) / 1000; paused = true; $("pause").textContent = "Resume"; hush(); }
};
$("next").onclick = function(){
hush();
if (idx + 1 < B.length){ paused = false; $("pause").textContent = "Pause"; show(idx + 1); }
else finish();
};
$("prev").onclick = function(){
hush();
if (idx > 0){ paused = false; $("pause").textContent = "Pause"; show(idx - 1); }
};
$("sound").onclick = function(){
sound = !sound;
$("sound").textContent = sound ? "Sound on" : "Sound off";
if (!sound) hush();
};
$("art").onclick = function(){
$("lbIn").innerHTML = $("art").innerHTML;
$("lb").className = "on";
};
$("lb").onclick = function(){ $("lb").className = ""; };
document.addEventListener("visibilitychange", function(){ if (!document.hidden) lock(); });
try { if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoice; } catch(e){}
setMode("full");
})();</script></body></html>
