im);font-family:var(--mono);letter-spacing:.04em;margin-top:2px}.eq{display:inline-flex;align-items:center;gap:5px;background:var(--calm);color:#26200F;border-radius:4px;padding:3px 8px 3px 6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-family:var(--sans)}.eq::before{content:"";width:8px;height:8px;background:#26200F;border-radius:1.5px;flex:0 0 8px}.eq.sm{font-size:9.5px;padding:2px 6px 2px 5px;gap:4px}.eq.sm::before{width:6px;height:6px;flex:0 0 6px}.row .eqs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}#kit{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 13px}#kit:empty{display:none}#needs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}#needs .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.row .dur{font-family:var(--mono);font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;margin-top:1px}.row.on .dur{color:var(--calm);border-color:#4A6455}.steps{display:none;padding:2px 0 4px 32px}.row.open + .steps{display:block}.steps ol{margin:0;padding:0 0 0 16px;font-size:14px;color:#C6D3C9}.steps li{padding:0 0 4px}.steps .c{margin:6px 0 0;font-size:13.5px;color:var(--calm);font-style:italic}#tray{position:fixed;left:0;right:0;bottom:0;background:#16261F;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}#tray .in{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}#tray .cnt{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}#tray .cnt b{color:var(--chalk);font-family:var(--mono);font-size:16px}#tray button{background:var(--surface);border:1px solid var(--line);color:var(--chalk);border-radius:10px;padding:11px 14px;font-size:14px;font-family:var(--sans);cursor:pointer}#tray button.pri{background:var(--signal);color:#0F1D17;border-color:var(--signal);font-weight:700}#tray button:disabled{opacity:.4;cursor:default}#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-140%);top:12px;z-index:50;background:var(--calm);color:#26200F;padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;transition:transform .3s}#toast.on{transform:translateX(-50%) translateY(0)}#run{display:none}#run.on{display:block}.runtop{display:flex;align-items:center;gap:12px;padding:14px 18px 8px;max-width:680px;margin:0 auto}.runtop .of{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.08em}.runtop .sp{flex:1}.iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 11px;font-size:12.5px;font-family:var(--sans);cursor:pointer}.stage{display:flex;gap:14px;max-width:680px;margin:0 auto;padding:0 18px 26px}.spine{width:11px;flex:0 0 11px;display:flex;flex-direction:column;gap:3px;padding-top:4px}.spine i{flex:1;background:#233A30;border-radius:6px;min-height:4px;display:block}.spine i.done{background:#3C6350}.spine i.now{background:var(--signal)}.main{flex:1;min-width:0}#title{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.12;margin:0 0 3px}#reps{font-family:var(--mono);font-size:12px;color:var(--calm);letter-spacing:.06em;margin:0 0 12px;min-height:15px}#art{display:flex;gap:8px;margin:0 0 14px;cursor:zoom-in}#art:empty{display:none}#art figure{flex:1;min-width:0;margin:0}#art figcaption{font-size:10.5px;color:var(--dim);margin-top:4px}#art img{display:block;width:100%;border-radius:9px;background:#16261F}#art figure.solo{max-width:340px;margin:0 auto}svg.fg{display:block;width:100%;height:auto;background:#16261F;border-radius:9px}svg.fg .gr{stroke:#3E5A4B;stroke-width:2;stroke-linecap:round}svg.fg polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}svg.fg .ts{stroke:#ECEFE7;stroke-width:11}svg.fg .lb{stroke:#ECEFE7;stroke-width:5}svg.fg .fr{stroke:#7B9A77;stroke-width:4.2}svg.fg .gh{stroke:#5E7669;stroke-width:3.4;stroke-dasharray:5 5;opacity:.62}svg.fg .bd{stroke:#DDBE7E;stroke-width:3}svg.fg .hd{fill:#ECEFE7}svg.fg .rg{fill:none;stroke:#DDBE7E;stroke-width:3}svg.fg .ar{fill:none;stroke:#DDBE7E;stroke-width:2.6;stroke-linecap:round;marker-end:url(#ah)}#clock{font-family:var(--mono);font-size:52px;line-height:1;margin:0 0 4px;font-variant-numeric:tabular-nums}#bar{height:3px;background:#233A30;border-radius:3px;overflow:hidden;margin:0 0 16px}#bar i{display:block;height:100%;width:0;background:var(--signal)}ol.rs{margin:0;padding:0;list-style:none;counter-reset:s}ol.rs li{position:relative;padding:0 0 11px 25px;counter-increment:s;font-size:16px;line-height:1.45;color:#8FA89B;transition:color .45s}ol.rs li::before{content:counter(s);position:absolute;left:0;top:2px;font-family:var(--mono);font-size:10.5px;color:#4E6858;transition:color .45s}ol.rs li.now{color:#FFFFFF}ol.rs li.now::before{color:var(--signal)}ol.rs li.past{color:#7B9286}.corr{margin:6px 0 0;padding:11px 13px;background:#1B2E25;border-left:2px solid var(--calm);border-radius:0 8px 8px 0;font-size:14.5px;color:var(--calm);font-style:italic}.corr:empty{display:none}.ctl{display:flex;gap:9px;max-width:680px;margin:0 auto;padding:0 18px 30px}.ctl button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--chalk);border-radius:11px;padding:13px 8px;font-size:14.5px;font-family:var(--sans);cursor:pointer}.ctl button.pri{background:var(--signal);color:#0F1D17;border-color:var(--signal);font-weight:700}#done{display:none;text-align:center;padding:56px 18px}#done.on{display:block}#done h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 10px}#done p{color:var(--muted);margin:0 0 22px}.big{display:block;width:100%;background:var(--signal);color:#0F1D17;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;font-family:var(--sans);cursor:pointer}.big.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);margin-top:10px}@media(max-width:520px){#art{flex-direction:column}#clock{font-size:44px}}</style></head><bod ='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='86' cy='40' r='8' class='hd'/><polyline points='86,52 100,40 66,18' class='fr'/><polyline points='86,52 72,40 110,46' class='lb'/><polyline points='110,46 88,26 66,18' class='bd'/><path d='M120 46 Q136 50 132 58' class='ar'/></svg>"],"ca":"Right arm travelling back","cb":"Left arm travelling back","m":"Switch — start with the left","g":"Band","e":["Loop band"]},{"s":"4 Sep","n":"One arm up, eyes the other way","r":"10 each side","d":90,"st":["Sit tall with the ribs tucked in so you're not arching — the movement is only in the arm.","The left arm is the one working: up and back behind you in external rotation, elbow straightening as it travels. The right arm stays back and still.","Since it's the left arm working, turn your eyes sharp right and hold them there, and see if it improves the range.","Ten reps, then switch at the chime: right arm up, eyes sharp left."],"c":"Close the ribs and isolate the movement to the arm","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='86' cy='39' r='8' class='hd'/><polyline points='86,52 102,60 108,70' class='fr'/><polyline points='86,52 74,38 78,22' class='lb'/><polyline points='78,22 94,54 108,70' class='bd'/><path d='M58 22 Q48 13 50 12' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='88' cy='39' r='8' class='hd'/><polyline points='86,52 102,60 108,70' class='fr'/><polyline points='86,52 78,36  the shoulders and pick the band back up.","Same as the very first time: pinkies turned in, ribs closed, arms up and then behind you.","Add the extension as well, and notice what's changed."],"c":"Do you feel more range of motion?","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='86' cy='40' r='8' class='hd'/><polyline points='86,52 102,38 112,22' class='fr'/><polyline points='86,52 70,38 60,22' class='lb'/><polyline points='60,22 86,17 112,22' class='bd'/><path d='M52 40 Q44 32 52 24' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 85,74 84,52' class='ts'/><circle cx='80' cy='40' r='8' class='hd'/><polyline points='84,52 100,38 122,22' class='fr'/><polyline points='84,52 68,38 70,22' class='lb'/><polyline points='70,22 96,17 122,22' class='bd'/><polyline points='84,52 66,40 58,22' class='gh'/><path d='M52 22 Q61 10 66 14' class='ar'/></svg>"],"ca":"Arms up in front","cb":"Travelling behind","m":null,"g":"Band","e":["Loop band"]},{"s":"4 Sep","n":"Low lunge, right arm circles","r":"hold 5","d":110,"st":["From down dog take the right leg up and back, bend the knee and turn the hips open, then step the right foot outside the right hand. Left knee down.","Make a small loop in the strap and hook it around the left foot, holding it with the right hand in external rotation, palm facing up.","Shift the hips back into a half split, right hand reaching towards the right toe, front leg straight.","Then bend the front knee and take the arm behind you — the arm makes a half circle, behind you and around.","On the last round stay there, bend the knee, walk the hand down the strap and maginary wall","Internally rotate the humerus, arm behind you","Scapula depressed, double chin, head tilted left","Wrist into flexion and extension","Then shoulder up, back and down ×5","Sensation 3/10, maximum 4/10 — toward the middle finger"],"c":"Chest stays neutral","f":null,"ca":"Wrist extended","cb":"Shoulder circling","g":"Nerve","e":[]},{"s":"27 Aug","n":"Median nerve floss — left","r":"×5","d":70,"st":["Left hand pushes out, wrist extended","Shoulder blade down, double chin, head back, head away from the shoulder","Wrist extension + shoulder depression + scapular retraction","Shoulder up, back and down ×5","Head stays to the side"],"c":"Head stays over to the side, deep breaths","f":null,"ca":"Setting the tension","cb":"Shoulder up and back","g":"Nerve","e":[]},{"s":"4 Sep","n":"Nerve floss, right arm","r":"×5","d":45,"st":["Come to a seat and take the right arm out to the side, the shoulder pressing down away from your ear.","Tilt the head to the left, away from that arm, and you'll feel the tingling travelling down.","Then bend the right elbow back in, elbow in line with the shoulder, and bring the head back to neutral.","Push away, and in. Five times."],"c":"This is the one for when your neck feels stiff at work","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='80' cy='40' r='8' class='hd'/><polyline points='86,52 74,62 70,72' class='fr'/><polyline points='86,52 108,50 126,48' class='lb'/><polyline points='86,52 100,54 96,38' class='gh'/><path d='M132 34 Q138 25 144 34' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='86,96 108,104 124,100' class='fr'/><polyline points='86,96 64,104 48,100' class='lb'/><polyline points='86,96 86,74 86,52' class='ts'/><circle cx='86' c his time, forearms perpendicular to the ground, and lift the head.","Now lift the hands off the floor and keep squeezing the elbows in, as if a foam roller sat between them.","The hands aren't touching. Push the back of the head backwards.","Squeeze the glutes and engage the core so the lower back doesn't collapse."],"c":"Use your back muscles instead of your arms","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='116,100 136,102 150,104' class='fr'/><polyline points='116,100 96,92 78,74' class='ts'/><polyline points='96,92 86,86 82,76' class='lb'/><circle cx='70' cy='66' r='8' class='hd'/><path d='M96 74 Q94 62 88 66' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='114,100 134,102 148,104' class='fr'/><polyline points='114,100 94,98 76,94' class='ts'/><polyline points='94,98 86,94 82,88' class='lb'/><circle cx='68' cy='90' r='8' class='hd'/><polyline points='114,100 94,92 76,74' class='gh'/><path d='M60 80 Q50 86 60 92' class='ar'/></svg>"],"ca":"Lifted, elbows squeezing","cb":"Lowering down","m":null,"g":"Strength","e":[]},{"s":"4 Sep","n":"Foam roller between the elbows","r":"hold 5","d":60,"st":["Lie on your belly and take the foam roller behind you, then bring one hand closer and then the other.","Your hands don't touch the floor — you should feel the roller in between your elbows.","Squeeze it and lift: glutes on, pubic bone pressing down, everything lifting through the back muscles.","Chin parallel to the chest so the back of the neck stays long. Hold it there for five."],"c":"Elbows hug in","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><polyline points='116,100 136,102 150,104' class='fr'/><polyline points='116,100 96,100 78,98' class='ts'/><polyline points='96,100 88,94 84,88' class='lb'/><circle cx='86' cy='86' r='7' class='rg'/><circle cx='68' cy='94' r='8' class= cx='62' cy='94' r='8' class='hd'/><polyline points='88,98 78,86 66,78' class='lb'/><polyline points='88,100 80,110 70,106' class='fr'/><rect x='140' y='74' width='26' height='10' rx='2' class='rg'/><path d='M52 84 Q40 84 44 92' class='ar'/></svg>"],"ca":"Arms wide, head centre","cb":"Turning with the breath","m":null,"g":"Rest","e":["Couch"]},{"s":"4 Sep","n":"Blocks under the shoulders","r":"","d":50,"st":["One block flat, and the second one set on its tip so it inclines.","The block goes between your shoulder blades, shoulders on the incline, and the head rests back onto the other one.","Open the arms out to the sides, knees bent, feet flat on the floor, knees together.","If that crowds the shoulders, use the supported fish version instead — one block between the shoulder blades, the other behind the head."],"c":"If your neck feels stuck, leave this one out","f":["<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><rect x='76' y='92' width='26' height='12' rx='2' class='rg'/><rect x='52' y='84' width='22' height='20' rx='2' class='rg'/><polyline points='126,92 108,92 92,90' class='ts'/><polyline points='126,92 140,100 132,106' class='fr'/><polyline points='126,92 138,102 128,108' class='lb'/><circle cx='78' cy='88' r='8' class='hd'/><path d='M64 68 Q54 74 64 80' class='ar'/></svg>","<svg viewBox='0 0 200 124' class='fg'><line x1='8' y1='111' x2='192' y2='111' class='gr'/><rect x='78' y='90' width='26' height='12' rx='2' class='rg'/><rect x='54' y='80' width='22' height='20' rx='2' class='rg'/><polyline points='128,96 108,88 92,84' class='ts'/><polyline points='128,96 142,104 134,108' class='fr'/><polyline points='128,96 140,104 130,108' class='lb'/><circle cx='76' cy='78' r='8' class='hd'/><polyline points='100,86 92,70 86,60' class='lb'/><polyline points='104,88 100,72 96,62' class='fr'/><polyline points='128,96 108,92 92,90' class='gh'/></svg>"],"ca":"Setting the blocks","cb":"Lying back, arms open","m":null,"g":"Rest","e":["2 blocks"]}];
var GROUPS = {"Neck":"Neck","Tspine":"T-spine","Band":"Band","Strap":"Strap","Shoulder":"Shoulders","Side":"Side body","Eyes":"Eyes","Nerve":"Nerve floss","Strength":"Strength","Rest":"Rest"};
var STEPS_OF = [30,45,60,90,120,150];

function svgOf(s){var o="<svg viewBox='0 0 200 124' class='fg'>"+
 "<line x1='8' y1='111' x2='192' y2='111' class='gr'/>";
 var M={g:'gh',f:'fr',l:'lb',t:'ts',b:'bd'};
 s.split(';').forEach(function(p){var i=p.indexOf(':'),k=p.slice(0,i),v=p.slice(i+1);
 if(M[k])o+="<polyline points='"+v+"' class='"+M[k]+"'/>";
 else{var n=v.split(',');
 if(k=='h')o+="<circle cx='"+n[0]+"' cy='"+n[1]+"' r='"+n[2]+"' class='hd'/>";
 else if(k=='r')o+="<circle cx='"+n[0]+"' cy='"+n[1]+"' r='"+n[2]+"' class='rg'/>";
 else if(k=='q')o+="<rect x='"+n[0]+"' y='"+n[1]+"' width='"+n[2]+"' height='"+n[3]+"' rx='2' class='rg'/>";
 else if(k=='a')o+="<path d='M"+n[0]+" "+n[1]+" Q"+n[4]+" "+n[5]+" "+n[2]+" "+n[3]+"' class='ar'/>";}});
 return o+"</svg>";}

var $=function(i){return document.getElementById(i);};
function artOf(b){
  if(b.img && b.img.length){
    if(b.img.length===1) return "<figure class='solo'><img src='"+b.img[0]+"'>"+
      "<figcaption>"+esc(b.ca||"")+"</figcaption></figure>";
    return "<figure><img src='"+b.img[0]+"'><figcaption>"+esc(b.ca||"")+"</figcaption></figure>"+
           "<figure><img src='"+b.img[1]+"'><figcaption>"+esc(b.cb||"")+"</figcaption></figure>";
  }
  if(b.f) return "<figure>"+svgOf(b.f[0])+"<figcaption>"+esc(b.ca||"")+"</figcaption></figure>"+
                 "<figure>"+svgOf(b.f[1])+"<figcaption>"+esc(b.cb||"")+"</figcaption></figure>";
  return "";
}
var fmt=function(s){s=Math.max(0,Math.round(s));
 return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
var esc=function(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML;};

/* ---------- selection state, mirrored into the URL ---------- */
var sel = {};                 // index -> duration in seconds
var order = [];               // selection order
var filter = null;

function readHash(){
  var h=(location.hash||"").replace(/^#/,"");
  if(!h) return;
  h.split(",").forEach(function(p){
    var b=p.split("x"), i=parseInt(b[0],10), d=parseInt(b[1],10);
    if(!isNaN(i)&&MOV[i]&&!sel.hasOwnProperty(i)){ sel[i]= (!isNaN(d)&&d>0)?d:MOV[i].d; order.push(i); }
  });
}
function writeHash(){
  var s=order.map(function(i){return i+"x"+sel[i];}).join(",");
  try{ history.replaceState(null,"", s? "#"+s : location.pathname); }catch(e){}
}

function total(){var t=0;order.forEach(function(i){t+=sel[i];});return t;}
function refreshTray(){
  $("tCnt").textContent=order.length;
  $("tDur").textContent=fmt(total());
  $("bGo").disabled = order.length===0;
  var kit=[]; order.forEach(function(i){ (MOV[i].e||[]).forEach(function(x){
    if(kit.indexOf(x)<0) kit.push(x); }); });
  $("needs").innerHTML = kit.length
    ? '<span class="lbl">Need</span>'+kit.map(function(x){
        return '<span class="eq sm">'+esc(x)+"</span>";}).join("") : "";
}

/* ---------- the picker ---------- */
function draw(){
  var h="", last=null;
  MOV.forEach(function(m,i){
    if(filter && m.g!==filter) return;
    if(m.g!==last){ h+='<div class="grp">'+esc(GROUPS[m.g])+"</div>"; last=m.g; }
    var on=sel.hasOwnProperty(i);
    h+='<div class="row'+(on?" on":"")+'" data-i="'+i+'">'+
       '<button class="tick" data-act="tick" aria-label="select"></button>'+
       '<div class="mid" data-act="open"><div class="nm">'+esc(m.n)+"</div>"+
       '<div class="sub">'+esc(m.s)+(m.r?" \u00b7 "+esc(m.r):"")+
       (m.img?" \u00b7 photo":(m.f?"":" \u00b7 no drawing"))+"</div>"+
       (m.e&&m.e.length?'<div class="eqs">'+m.e.map(function(x){
         return '<span class="eq sm">'+esc(x)+"</span>";}).join("")+"</div>":"")+"</div>"+
       '<button class="dur" data-act="dur">'+fmt(on?sel[i]:m.d)+"</button></div>"+
       '<div class="steps"><ol>'+m.st.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+
       "</ol>"+(m.c?'<p class="c">'+esc(m.c)+"</p>":"")+"</div>";
  });
  $("list").innerHTML=h;
}
function drawChips(){
  var keys=[]; MOV.forEach(function(m){ if(keys.indexOf(m.g)<0) keys.push(m.g); });
  $("chips").innerHTML='<button data-g="" aria-pressed="'+(!filter)+'">All 66</button>'+
    keys.map(function(k){return '<button data-g="'+k+'" aria-pressed="'+(filter===k)+'">'+
      esc(GROUPS[k])+" "+MOV.filter(function(m){return m.g===k;}).length+"</button>";}).join("");
}

$("chips").onclick=function(e){
  var b=e.target.closest("button"); if(!b) return;
  filter=b.getAttribute("data-g")||null; drawChips(); draw();
};
$("list").onclick=function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var row=b.closest(".row"), i=parseInt(row.getAttribute("data-i"),10), act=b.getAttribute("data-act");
  if(act==="open"){ row.classList.toggle("open"); return; }
  if(act==="tick"){
    if(sel.hasOwnProperty(i)){ delete sel[i]; order=order.filter(function(x){return x!==i;}); }
    else { sel[i]=MOV[i].d; order.push(i); }
  }
  if(act==="dur"){
    if(!sel.hasOwnProperty(i)){ sel[i]=MOV[i].d; order.push(i); }
    var k=STEPS_OF.indexOf(sel[i]); sel[i]=STEPS_OF[(k+1)%STEPS_OF.length];
  }
  writeHash(); draw(); refreshTray();
};
$("bClear").onclick=function(){ sel={}; order=[]; writeHash(); draw(); refreshTray(); };
$("bCopy").onclick=function(){
  var url=location.origin+location.pathname+(order.length?"#"+order.map(function(i){
    return i+"x"+sel[i];}).join(","):"");
  var ok=function(){ toast("Link copied"); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(ok,function(){ toast("Copy the address bar"); });
  } else toast("Copy the address bar");
};
function toast(t){ $("toastTxt").textContent=t; $("toast").className="on";
  setTimeout(function(){ $("toast").className=""; },2200); }

/* ---------- audio + speech ---------- */
var actx=null,sound=true;
function ac(){ if(!sound) return null;
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
   if(actx.state==="suspended") actx.resume(); return actx; }catch(e){ return null; } }
function tone(f,w,d,v){ var a=ac(); if(!a) return;
  try{ var o=a.createOscillator(),g=a.createGain(); o.type="sine"; o.frequency.value=f;
   g.gain.setValueAtTime(0.0001,a.currentTime+w);
   g.gain.exponentialRampToValueAtTime(v||0.16,a.currentTime+w+0.015);
   g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+w+d);
   o.connect(g);g.connect(a.destination);o.start(a.currentTime+w);o.stop(a.currentTime+w+d+0.05);
  }catch(e){} }
var chime=function(){tone(660,0,0.55);}, dbl=function(){tone(600,0,0.4);tone(760,0.17,0.45);},
    tick=function(){tone(430,0,0.11,0.09);},
    fan=function(){[523,659,784,1046].forEach(function(f,i){tone(f,i*0.13,0.5);});};
var voice=null,vq=[],vbusy=false;
function loadVoice(){ try{ var vs=window.speechSynthesis?speechSynthesis.getVoices():[];
  if(!vs||!vs.length) return;
  var w=["Samantha","Karen","Serena","Google UK English Female","Google US English","Daniel","Alex"];
  for(var i=0;i<w.length;i++) for(var j=0;j<vs.length;j++) if(vs[j].name===w[i]){voice=vs[j];return;}
  for(var k=0;k<vs.length;k++) if(/^en/i.test(vs[k].lang)){voice=vs[k];return;} }catch(e){} }
function vnext(){ if(vbusy||!vq.length) return; var t=vq.shift();
  try{ var u=new SpeechSynthesisUtterance(t); if(voice)u.voice=voice; u.rate=0.97;
   vbusy=true; u.onend=u.onerror=function(){vbusy=false;vnext();}; speechSynthesis.speak(u);
  }catch(e){vbusy=false;} }
function say(t){ if(!sound||!window.speechSynthesis) return; vq.push(t); vnext(); }
function hush(){ vq=[];vbusy=false; try{speechSynthesis.cancel();}catch(e){} }
var wake=null;
function lock(){ try{ if(navigator.wakeLock&&navigator.wakeLock.request)
  navigator.wakeLock.request("screen").then(function(w){wake=w;},function(){}); }catch(e){} }
function unlock(){ try{ if(wake&&wake.release){wake.release();wake=null;} }catch(e){} }

/* ---------- runner ---------- */
var Q=[],idx=0,running=false,paused=true,t0=0,acc=0,fired={},raf=null;
var GAP=3.6;
function show(i){
  idx=i; var b=Q[i];
  $("title").textContent=b.n;
  $("reps").textContent=b.r||"";
  $("kit").innerHTML=(b.e||[]).map(function(x){return '<span class="eq">'+esc(x)+"</span>";}).join("");
  $("art").innerHTML = artOf(b);
  $("corr").textContent=b.c||"";
  $("of").textContent=String(i+1).padStart(2,"0")+" / "+String(Q.length).padStart(2,"0");
  $("cue").innerHTML='<ol class="rs">'+b.st.map(function(x){
    return "<li>"+esc(x)+"</li>";}).join("")+"</ol>";
  var sp=$("spine").children;
  for(var k=0;k<sp.length;k++) sp[k].className = k<i?"done":(k===i?"now":"");
  fired={};acc=0;t0=performance.now();
  paused=false; $("pause").textContent="Pause";   // a block always starts running
  $("clock").textContent=fmt(b.d); $("barI").style.width="0%";
  chime(); say(b.n);
}
function body(){
  var b=Q[idx], e=acc+(paused?0:(performance.now()-t0)/1000), left=b.d-e;
  $("clock").textContent=fmt(left);
  $("barI").style.width=Math.min(100,(e/b.d)*100)+"%";
  var lis=$("cue").getElementsByTagName("li");
  var live=Math.min(lis.length,Math.floor(e/GAP)+1);
  for(var k=0;k<lis.length;k++)
    lis[k].className = k<live-1?"past":(k===live-1?"now":"");
  for(var m=0;m<live;m++){ if(!fired["s"+m]){ fired["s"+m]=1; if(m>0) say(b.st[m]); } }
  if(b.m && e>=b.d/2 && !fired.mid){ fired.mid=1; dbl(); say(b.m); }
  [3,2,1].forEach(function(n){ if(left<=n&&left>n-1&&!fired["c"+n]){fired["c"+n]=1;tick();} });
  if(left<=0){
    if(idx+1<Q.length){ var nx=idx+1; paused=true; setTimeout(function(){show(nx);},250); }
    else finish();
  }
}
function loop(){ try{ if(running&&!paused) body(); }catch(err){}
  if(running) raf=requestAnimationFrame(loop); }
function finish(){ running=false;paused=true;unlock();fan();
  $("run").className="";$("done").className="on";
  var t=Q.reduce(function(a,b){return a+b.d;},0);
  $("doneP").textContent=Q.length+" movements, "+fmt(t)+".";
  say("That's the session."); }
function start(){
  Q=order.map(function(i){ var m=MOV[i],c={}; for(var k in m) c[k]=m[k]; c.d=sel[i]; return c; });
  if(!Q.length) return;
  $("spine").innerHTML=Q.map(function(){return "<i></i>";}).join("");
  $("pick").style.display="none"; $("tray").style.display="none";
  $("done").className=""; $("run").className="on";
  running=true;paused=false;loadVoice();lock();show(0);
  if(raf) cancelAnimationFrame(raf); loop();
}
function goHome(){ running=false;paused=true;unlock();hush();
  if(raf){cancelAnimationFrame(raf);raf=null;}
  $("run").className="";$("done").className="";
  $("pick").style.display="";$("tray").style.display=""; }

$("bGo").onclick=start; $("again").onclick=start;
$("home2").onclick=goHome; $("home3").onclick=goHome;
$("pause").onclick=function(){
  if(paused){t0=performance.now();paused=false;$("pause").textContent="Pause";}
  else{acc+=(performance.now()-t0)/1000;paused=true;$("pause").textContent="Resume";hush();} };
$("next").onclick=function(){ hush();
  if(idx+1<Q.length){paused=false;$("pause").textContent="Pause";show(idx+1);} else finish(); };
$("prev").onclick=function(){ hush();
  if(idx>0){paused=false;$("pause").textContent="Pause";show(idx-1);} };
$("sound").onclick=function(){ sound=!sound;
  $("sound").textContent=sound?"Sound on":"Sound off"; if(!sound) hush(); };
$("art").onclick=function(){};
document.addEventListener("visibilitychange",function(){ if(!document.hidden) lock(); });
try{ if(window.speechSynthesis) speechSynthesis.onvoiceschanged=loadVoice; }catch(e){}

/* bootstrap last */
readHash(); drawChips(); draw(); refreshTray();
})();
</script></body></html>
