ward your bum, then round forward as you come in. A few rounds.","Bend your left knee out to 90 degrees, hands on your hips, right knee supporting you on the ground.","Shift your hips over to the left and rotate the knee in and out."],"c":"","e":[]},{"k":14,"g":"","n":"Knee-down side angle into alternating knee drops","r":"4 each side","df":60,"ds":40,"m":null,"ca":"Side-angle, knee down","cb":"Alternating knee drop","s":["From the side-angle position, bring your hands down, open your feet wide, and sink into a squat.","Bring your right knee down to the floor with an internal rotation, keeping your hips where they are. Then the left knee comes down too.","From there: right knee down, left knee down \u2014 that's one. Keep the hips low and steady each time you switch. Four rounds.","Hands can rest lightly on blocks if you need the support."],"c":"When the knee touches down, the hips stay where they are \u2014 they don't rise and fall with it.","e":[]},{"k":15,"g":"Standing flow","n":"Sun-salutation flow into active pigeon, right","r":"","df":150,"ds":0,"m":"Fold and downward dog","ca":"Low lunge, foot rotation","cb":"Active pigeon push-through","s":["Standing at the front of your mat, feet hip-width. Inhale, arms reach up; exhale, fold forward.","Step back to downward-facing dog, then lower down through plank onto your belly.","Slide your right knee out to the side into a low lunge, left toes tucked under. Reach your left arm behind you, then up and over into a side bend.","Turn your back foot in and lift the right leg back into an active pigeon \u2014 the same push-through as before, a few rounds.","Downward dog to rest, then repeat on the left."],"c":"Keep the pelvis neutral in the lunge and see how far forward you can go without it tipping.","e":[]},{"k":16,"g":"","n":"Same, left","r":"","df":150,"ds":0,"m":"Fold and downward dog","ca":"Low lunge, foot rotation","cb":"Active pigeon push-through","s":["Same flow, mirrored: fold, downward dog, lower through plank.","Left knee out to the side into the low lunge, right toes tucked under. Right arm behind you, then up and over into the side bend.","Turn the back foot in, lift the left leg back into active pigeon \u2014 push through a few rounds.","Downward dog, then rest."],"c":"","e":[]},{"k":17,"g":"","n":"Malasana with ankle mobility, optional backbend","r":"","df":175,"ds":40,"m":"Add the backbend if it's comfortable","ca":"Malasana, heels on blanket","cb":"Optional backbend","s":["Feet turned out, hips sinking low into malasana. Roll a blanket under your heels if that helps you balance.","Squeeze your inner thighs, tailbone tucked, and lift up out of the squat, then lower back down. A few rounds.","If your neck is comfortable, you can add a gentle backbend at the top of one of the lifts \u2014 head tips back only as far as it wants to.","Hands can rest on your hips or close the ribs in."],"c":"Keep your knees together as you lower \u2014 the heels may lift, and that's fine.","e":["Blanket (optional)"]},{"k":18,"g":"Closing","n":"Supine twist and hip-flexor stretch, both sides","r":"5 breaths each side","df":305,"ds":200,"m":"Switch sides","ca":"Supine twist with block","cb":"Hip-flexor stretch","s":["Lying down with a block elevating your hips, lengthwise under your sacrum.","One knee comes in toward your chest, the other leg stays long on the floor \u2014 you'll feel the stretch along the front of that hip.","From there, come up into a kneeling hip-flexor stretch: back knee down, front leg forward, internally rotating the back thigh.","Hold five breaths on each side, breathing into wherever feels tightest, then switch."],"c":"This is breath-paced, not rep-paced \u2014 let it run as long as it needs to.","e":["Block"]}];

B = ALL.filter(function(b){ return mode === "full" ? true : b.ds > 0; });
B = B.map(function(b){
var c = {}; for (var k in b) c[k] = b[k];
c.d = mode === "full" ? b.df : b.ds;
return c;
});
};
var actx = null;
var ac = function(){
if (!sound) return null;
try { if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
if (actx.state !== "running" && actx.resume) actx.resume();
return actx; } catch(e){ return null; }
};
var tone = function(f, when, dur, vol){
var a = ac(); if (!a) return;
try {
var o = a.createOscillator(), g = a.createGain();
o.type = "sine"; o.frequency.value = f;
g.gain.setValueAtTime(0.0001, a.currentTime + when);
g.gain.exponentialRampToValueAtTime(vol||0.16, a.currentTime + when + 0.015);
g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + when + dur);
o.connect(g); g.connect(a.destination);
o.start(a.currentTime + when); o.stop(a.currentTime + when + dur + 0.05);
} catch(e){}
};
var chimeOne  = function(){ tone(660, 0, 0.55); };
var chimeTwo  = function(){ tone(600, 0, 0.4); tone(760, 0.17, 0.45); };
var tick      = function(){ tone(430, 0, 0.11, 0.09); };
var fanfare   = function(){ [523,659,784,1046].forEach(function(f,i){ tone(f, i*0.13, 0.5); }); };
var voice = null, vq = [], vbusy = false;
var loadVoice = function(){
try {
var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
if (!vs || !vs.length) return;
for (var p = 0; p < vs.length; p++){ if (/premium|enhanced|neural/i.test(vs[p].name) && /^en/i.test(vs[p].lang)) { voice = vs[p]; return; } }
var want = ["Ava","Nicky","Samantha","Zoe","Karen","Serena","Google UK English Female","Google US English","Daniel","Alex"];
for (var i = 0; i < want.length; i++){
for (var j = 0; j < vs.length; j++){ if (vs[j].name === want[i]) { voice = vs[j]; return; } }
}
for (var k = 0; k < vs.length; k++){ if (/^en/i.test(vs[k].lang)) { voice = vs[k]; return; } }
} catch(e){}
};
var vnext = function(){
if (vbusy || !vq.length) return;
var txt = vq.shift();
try {
var u = new SpeechSynthesisUtterance(txt);
if (voice) u.voice = voice;
u.rate = 0.94; u.pitch = 1.0;
vbusy = true;
var wd = setTimeout(function(){ if (vbusy) { vbusy = false; vnext(); } }, 2500 + txt.length * 110);
u.onend = u.onerror = function(){ clearTimeout(wd); vbusy = false; vnext(); };
speechSynthesis.speak(u);
} catch(e){ vbusy = false; }
};
var say = function(t){
if (!sound || !window.speechSynthesis) return;
vq.push(strip(t)); vnext();
};
var hush = function(){ vq = []; vbusy = false;
try { speechSynthesis.cancel(); } catch(e){} };
var lock = function(){
try { if (navigator.wakeLock && navigator.wakeLock.request)
navigator.wakeLock.request("screen").then(function(w){ wake = w; }, function(){}); } catch(e){}
};
var unlock = function(){ try { if (wake && wake.release) { wake.release(); wake = null; } } catch(e){} };
var thumbOf = function(b){
if (!Object.keys(ART).length) return "";
var a = ART[b.k];
if (!a || !a.v || !a.v.length) return '<span class="th none"></span>';
return '<span class="th">' + (a.k === "svg" ? svgOf(a.v[0]) : '<img loading="lazy" alt="" src="' + a.v[0] + '">') + '</span>';
};
var drawPlan = function(){
var h = "", last = null, tot = 0;
B.forEach(function(b, i){
if (b.g && b.g !== last){ h += '<div class="grp">' + b.g + "</div>"; last = b.g; }
tot += b.d;
h += '<div class="row"><span class="i">' + String(i+1).padStart(2,"0") + '</span>' + thumbOf(b) +
'<span class="n">' + b.n + (b.r ? ' <span style="color:#5E7669;font-size:12px">' + b.r + "</span>" : "") +
'</span>' + (b.e && b.e.length ? b.e.map(function(x){
return '<span class="eq sm">' + x + "</span>"; }).join(" ") + " " : "") +
'<span class="t">' + fmt(b.d) + "</span></div>";
});
h += '<div class="row tot"><span class="i"></span><span class="n">' + B.length +
' blocks</span><span class="t">' + fmt(tot) + "</span></div>";
$("plan").innerHTML = h;
var kit = [];
B.forEach(function(b){ (b.e||[]).forEach(function(x){ if (kit.indexOf(x) < 0) kit.push(x); }); });
$("needs").innerHTML = kit.length
? '<span class="lbl">You\'ll need</span>' + kit.map(function(x){
return '<span class="eq">' + x + "</span>"; }).join("")
: '<span class="lbl">You\'ll need</span><span style="font-size:13.5px;color:#8FA89B">Just a mat</span>';
};
var setMode = function(m){
mode = m;
$("mFull").setAttribute("aria-pressed", m === "full" ? "true" : "false");
$("mShort").setAttribute("aria-pressed", m === "short" ? "true" : "false");
pick(); drawPlan();
};
var figs = function(b){
var a = ART[b.k];
if (!a || !a.v || !a.v.length) return "";
var items = (a.k === "svg")
? a.v.map(svgOf)
: a.v.map(function(d){ return '<img src="' + d + '" alt="">'; });
if (items.length === 1)
return '<figure class="solo">' + items[0] +
'<figcaption>' + (b.ca || "") + "</figcaption></figure>";
return '<figure>' + items[0] + '<figcaption>' + b.ca + "</figcaption></figure>" +
'<figure>' + items[1] + '<figcaption>' + b.cb + "</figcaption></figure>";
};
var STEP_GAP = 3.6;
var show = function(i){
idx = i;
var b = B[i];
$("title").textContent = b.n;
$("reps").textContent  = b.r || "";
$("kit").innerHTML = (b.e || []).map(function(x){
return '<span class="eq">' + x + "</span>"; }).join("");
$("art").innerHTML     = figs(b);
$("corr").textContent  = b.c;
$("of").textContent    = String(i+1).padStart(2,"0") + " / " + String(B.length).padStart(2,"0");
$("cue").innerHTML = '<ol class="steps">' +
b.s.map(function(x){ return "<li>" + x + "</li>"; }).join("") + "</ol>";
$("enc").className = "";
$("enc").textContent = "";
var sp = $("spine").children;
for (var k = 0; k < sp.length; k++)
sp[k].className = k < i ? "done" : (k === i ? "now" : "");
fired = {}; acc = 0; t0 = performance.now();
paused = false;                       // a block always starts running
$("pause").textContent = "Pause";
$("clock").textContent = fmt(b.d);
$("barI").style.width = "0%";
chimeOne();
say(b.n);
};
var banner = function(t){
$("bannerTxt").textContent = t;
$("banner").className = "on";
setTimeout(function(){ $("banner").className = ""; }, 4200);
};
var body = function(){
var b = B[idx];
var e = acc + (paused ? 0 : (performance.now() - t0) / 1000);
var left = b.d - e;
$("clock").textContent = fmt(left);
$("barI").style.width = Math.min(100, (e / b.d) * 100) + "%";
var lis = $("cue").getElementsByTagName("li");
var live = Math.min(lis.length, Math.floor(e / STEP_GAP) + 1);
for (var k = 0; k < lis.length; k++){
if (k < live - 1)      lis[k].className = "past";   // done, still readable
else if (k === live-1) lis[k].className = "now";    // lit white
else                   lis[k].className = "";       // upcoming, still readable
}
for (var m = 0; m < live; m++){
var key = "s" + m;
if (!fired[key]) { fired[key] = 1; if (m > 0) say(b.s[m]); }
}
if (b.m && e >= b.d / 2 && !fired.mid){
fired.mid = 1; chimeTwo(); banner(b.m); say(b.m);
}
[3,2,1].forEach(function(n){
if (left <= n && left > n - 1 && !fired["c" + n]) { fired["c" + n] = 1; tick(); }
});
if (left <= 0){
if (ENC[b.k]) { $("enc").textContent = ENC[b.k]; $("enc").className = "on"; say(ENC[b.k]); }
if (idx + 1 < B.length){
var nx = idx + 1;
setTimeout(function(){ show(nx); }, ENC[b.k] ? 2100 : 250);
paused = true;
} else {
finish();
}
}
};
var loop = function(){
try { if (running && !paused) body(); } catch(err){ /* never stop the clock */ }
if (running) raf = requestAnimationFrame(loop);
};
var finish = function(){
running = false; paused = true; unlock(); fanfare();
$("run").className = ""; $("done").className = "on";
var tot = B.reduce(function(a, b){ return a + b.d; }, 0);
$("doneP").textContent = B.length + " blocks, " + fmt(tot) + ".";
say("That's the session.");
};
var start = function(){
pick();
$("spine").innerHTML = B.map(function(){ return "<i></i>"; }).join("");
$("home").style.display = "none";
$("done").className = "";
$("run").className = "on";
running = true; paused = false;
loadVoice(); lock();
show(0);
if (raf) cancelAnimationFrame(raf);
loop();
};
var goHome = function(){
running = false; paused = true; unlock(); hush();
if (raf) { cancelAnimationFrame(raf); raf = null; }
$("run").className = ""; $("done").className = "";
$("home").style.display = "";
};
$("mFull").onclick  = function(){ setMode("full"); };
$("mShort").onclick = function(){ setMode("short"); };
$("go").onclick     = start;
$("again").onclick  = start;
$("home2").onclick  = goHome;
$("home3").onclick  = goHome;
$("pause").onclick = function(){
if (paused){ t0 = performance.now(); paused = false; $("pause").textContent = "Pause"; }
else { acc += (performance.now() - t0) / 1000; paused = true; $("pause").textContent = "Resume"; hush(); }
};
$("next").onclick = function(){
hush();
if (idx + 1 < B.length){ paused = false; $("pause").textContent = "Pause"; show(idx + 1); }
else finish();
};
$("prev").onclick = function(){
hush();
if (idx > 0){ paused = false; $("pause").textContent = "Pause"; show(idx - 1); }
};
$("sound").onclick = function(){
sound = !sound;
$("sound").textContent = sound ? "Sound on" : "Sound off";
if (!sound) hush();
};
$("art").onclick = function(){
$("lbIn").innerHTML = $("art").innerHTML;
$("lb").className = "on";
};
$("lb").onclick = function(){ $("lb").className = ""; };
document.addEventListener("visibilitychange", function(){ if (!document.hidden) lock(); });
try { if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoice; } catch(e){}
setMode("full");
})();</script></body></html>
