itch \u2014 right arm on top","ca":"Top elbow bent","cb":"Straightening, pushing back","s":["Left arm on top \u2014 that is the arm that does the work. The right one only anchors.","The left arm externally rotates and comes up and over, elbow hugging in towards your ear, hand dropping down your back.","The right arm internally rotates and goes low behind your back. It only holds the band and pulls down for resistance \u2014 it does not move.","Now bend and straighten the left elbow five times and let the triceps do the job. The right hand stays exactly where it is.","Then push both arms backwards together. At the chime, swap: right arm on top and working, left arm anchoring."],"c":"Don't let the top elbow splay out \u2014 hug it in towards your ear","e":["Loop band"]},{"k":8,"g":"","n":"Shoulder flossing again","r":"","df":45,"ds":32,"m":null,"ca":"Arms up in front","cb":"Travelling behind","s":["Shake out the shoulders and pick the band back up.","Same as the very first time: pinkies turned in, ribs closed, arms up and then behind you.","Add the extension as well, and notice what's changed."],"c":"Do you feel more range of motion?","e":["Loop band"]},{"k":9,"g":"On the floor","n":"Down dog, neck free","r":"","df":100,"ds":25,"m":null,"ca":"Folding forward","cb":"Down dog, hips high","s":["Feet apart at the front of the mat. Inhale, arms reach, gaze up; exhale and fold as you bend the knees.","Inhale to a halfway lift, lengthening the heart forward, then step the legs back to downward facing dog.","Bend the knees, lift the hips up high, open the fingers wide \u2014 as wide as the mat if that feels better.","Bend and hug the elbows in, push the hands down and elevate the shoulders, and move the neck side to side and up and down while you're there."],"c":"Not too much effort in the upper traps","e":[]},{"k":10,"g":"","n":"Wide-hand cobra","r":"\u00d75","df":60,"ds":43,"m":null,"ca":"Lowered down","cb":"Lifted, head back","s":["Come into plank and lower all the way to r, that's the moment to bend the elbows and push up into cobra.","Then round the back and travel back to child's pose."],"c":"Hug your elbows in \u2014 don't let them turn out","e":["Blanket"]},{"k":14,"g":"On the wheel","n":"Wheel and band, hips up and down","r":"\u00d710","df":110,"ds":79,"m":null,"ca":"Hips lowering, arms pushing","cb":"Hips lifted","s":["Thread the loop inside the wheel and take both edges over to the side, so the band is equal on both ends.","Lie back over the wheel \u2014 head and shoulder blades both supported \u2014 elbows in, head back. Mind your hair.","Lift the hips like a hip thrust, then extend the arms fully out against the band.","Keep the hands travelling down towards the floor as you lower the bum down. You don't have to go all the way.","Hips up, tuck the tailbone, and go again. Ten reps."],"c":"The elbows want to come up \u2014 keep them in","e":["Wheel","Loop band"]},{"k":15,"g":"","n":"Elbows bent on the wheel","r":"","df":90,"ds":20,"m":null,"ca":"Draped back, elbows bent","cb":"Coming up","s":["Let go of the strap and hold the sides of the wheel instead.","Bend the elbows and bring them down, the way you would in Dwi Pada.","Lengthen the side body first so there's space in the lumbar spine before you go back."],"c":"The backbend lives mostly in the upper thoracic spine","e":["Wheel"]},{"k":16,"g":"Hips \u2014 90/90 & twist","n":"90/90 setup, foot flexion, hip lift \u2014 right","r":"~8 foot lifts, 5 hip lifts","df":85,"ds":61,"m":null,"ca":"Foot flexion \u2014 lift and lower","cb":"Hip lift, knee opening","s":["Sit in your 90/90: right shin bent in front of you at a right angle, left shin bent behind you, also at a right angle.","Lift your right foot straight up toward the ceiling, then lower it. Repeat about 8 times.","Hands off the floor if you can manage it. Lift your right knee straight up, open it out to the side, and bring it back down \u2014 five times.","On the fifth, hold there: right knee, right hip, and right ankle stacked in one line."],"c":"Use your glute to open the knee wider \u2014 not your hands.","e":[]},{"k":17,"g":"","n":"Twist, right","r":"5 reps + 2 rounds","df":70,"ds":50,"m":null,"ca":"Lift and twist forward","cb":"Hold, arm reach, side bend","s":["Bend your knees and bring them over to your right side.","Lift your left leg, swing it forward, turn it outward, and set your left foot on the outside of your right knee.","Lift the leg back and bring it forward into the twist \u2014 five times. On the fifth, stay there.","Bring your right foot in closer to your hip, ground your left hip into the floor, left knee pointing at the ceiling. Reach your right arm up and side-bend left.","Inhale, lift both arms up. Exhale, open to the right and fold \u2014 shoulders back, chest lifting. Two rounds."],"c":"Left knee pushes away from your left elbow as you twist.","e":[]},{"k":18,"g":"","n":"90/90 hip lift, left","r":"5 reps","df":50,"ds":36,"m":null,"ca":"Setup, mirrored","cb":"Hip lift, knee opening","s":["Same 90/90, mirrored: left shin bent in front of you, right shin bent behind.","Hands off the floor if you can. Lift your left knee straight up, open it out to the side, and bring it back down \u2014 five times.","On the fifth, hold: left knee, left hip, left ankle stacked in one line."],"c":"Same cue as the right side \u2014 glute opens the knee, not the hands.","e":[]},{"k":19,"g":"","n":"Twist, left","r":"5 reps + 2 rounds","df":70,"ds":50,"m":null,"ca":"Lift and twist forward","cb":"Hold, arm reach, side bend","s":["Bend your knees, bring them over to your left side.","Lift your right leg, swing it forward, turn it outward, and set your right foot on the outside of your left knee.","Lift back and bring it forward into the twist \u2014 five times. On the fifth, stay there.","Left foot in closer to your hip, ground your right hip into the floor, right knee pointing at the ceiling. Reach your left arm up and side-bend right.","Inhale, lift both arms up. Exhale, open to the left and fold. Two rounds."],"c":"Right knee pushes away from your right elbow as you twist.","e":[]},{"k":20,"g":"Hips \u2014 pigeon","n":"Pigeon transitions, both sides","r":"","df":80,"ds":16,"m":"Switch \u2014 other leg back","ca":"Right leg back","cb":"Left leg back","s":["Knees to your right, left leg reaches behind you and turns inward \u2014 this is your pigeon pose.","Shift your hips to the side, then back to center.","Knees to your left, right leg reaches behind you and turns inward. Shift and center.","Hands can stay on the floor the whole time, or come off if you're feeling steady."],"c":"Squeeze the legs toward each other and lift the hips \u2014 don't just sink into it.","e":[]},{"k":21,"g":"Hips \u2014 closer","n":"Knee-down side angle into alternating knee drops","r":"4 each side","df":60,"ds":43,"m":null,"ca":"Side-angle, knee down","cb":"Alternating knee drop","s":["From the side-angle position, bring your hands down, open your feet wide, and sink into a squat.","Bring your right knee down to the floor with an internal rotation, keeping your hips where they are. Then the left knee comes down too.","From there: right knee down, left knee down \u2014 that's one. Keep the hips low and steady each time you switch. Four rounds.","Hands can rest lightly on blocks if you need the support."],"c":"When the knee touches down, the hips stay where they are \u2014 they don't rise and fall with it.","e":[]}];

else { acc += (performance.now() - t0) / 1000; paused = true; $("pause").textContent = "Resume"; hush(); }
};
$("next").onclick = function(){
hush();
if (idx + 1 < B.length){ paused = false; $("pause").textContent = "Pause"; show(idx + 1); }
else finish();
};
$("prev").onclick = function(){
hush();
if (idx > 0){ paused = false; $("pause").textContent = "Pause"; show(idx - 1); }
};
$("sound").onclick = function(){
sound = !sound;
$("sound").textContent = sound ? "Sound on" : "Sound off";
if (!sound) hush();
};
$("art").onclick = function(){
$("lbIn").innerHTML = $("art").innerHTML;
$("lb").className = "on";
};
$("lb").onclick = function(){ $("lb").className = ""; };
document.addEventListener("visibilitychange", function(){ if (!document.hidden) lock(); });
try { if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoice; } catch(e){}
setMode("full");
